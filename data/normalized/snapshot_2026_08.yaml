ocr_notes:
  - "moneyforward_assets_machine_readable.yaml は snapshot_date が null のため、crypto_summary_2026-08-09.json の processed_date と依頼日 2026-08-09 を基準に snapshot_date を 2026-08-09 とした。"
  - "売買可能明細の account_type は添付 YAML では確認できないため snapshot では null を維持し、既知の口座区分は holdings/versions/2026-08-02.yaml の overlay に委ねる。"
  - "投資信託の symbol は既存参照互換のため NISSEI_SOX_INDEX_1/2 を NISSEI_SOX_1/2、EMAXIS_SLIM_ALL_COUNTRY_FUND を EMAXIS_SLIM_ALL_COUNTRY に正規化した。"
  - "暗号資産は crypto_summary_2026-08-09.json から個別 holdings を追加した。数量、平均取得単価、現在単価は添付 JSON にないため null のまま保持した。"
  - "crypto_summary_2026-08-09.json の reward_points 162 は portfolio.current_value に含まれない別指標のため total_assets_jpy へ加算していない。"
validation_notes:
  - "Money Forward のカテゴリ合計 39,729,489円 と crypto_summary の portfolio.current_value 322,422円 の合算は total_assets_jpy 40,051,911円 と一致。"
  - "株式（現物）の個別評価額合計は 5,885,222円 でカテゴリ合計 5,885,224円 より 2円少ない。添付 YAML の表示値を維持し、差額 2円 は表示丸め差として扱う。"
  - "holdings の market_value_jpy 合計は 40,051,909円 で total_assets_jpy より 2円少ないが、上記の株式カテゴリ差額と一致する。"
  - "ポイント集約値 16,233円 は添付 YAML の 3明細内訳（ANA 786円、Tポイント 7円、楽天ポイント 15,440円）と一致。"
  - "暗号資産 3明細の current_value 合計 322,422円 は crypto_summary_2026-08-09.json の portfolio.current_value と一致。"
