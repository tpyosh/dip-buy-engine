        target_return_pct: null
        target_return_derivation:
          status: "reviewer_to_derive"
          decision_owner: "independent_monthly_reviewer"
          method: "derive the real required return from current investable assets, reviewer-derived sustainable contributions, retirement spending, public pension, planning end age, terminal asset floor, and documented treatment of inheritance"
          evidence_requirements:
            - "packet_confirmed_cash_flow_and_asset_values"
            - "official_pension_and_inflation_sources"
            - "explicit_formula_and_assumption_date"
          sensitivity_required: true
          base_case_required: true
        return_basis: "real"
        horizon_years: 66
        accumulation_horizon_years: 31
        withdrawal_horizon_years: 35
        success_probability_pct: null
        success_probability_derivation:
          status: "reviewer_to_derive"
          decision_owner: "independent_monthly_reviewer"
          method: "select a planning success probability using cited financial-planning or retirement-income evidence and the user's confirmed lifestyle-preserving age-65-profit objective"
          evidence_requirements:
            - "verifiable_financial_planning_or_retirement_income_evidence"
            - "rationale_connected_to_lifestyle_and_age_65_profit_objective"
          sensitivity_required: true
          base_case_required: true
        retirement_spending_derivation:
          status: "reviewer_to_derive"
          decision_owner: "independent_monthly_reviewer"
          method: "derive a current-JPY retirement spending base case from confirmed essential expenses, observed discretionary bonus use, inflation assumptions, and the stated goal; do not present it as a user-confirmed preference"
          evidence_requirements:
            - "packet_confirmed_current_spending_and_bonus_facts"
            - "official_or_primary_inflation_and_retirement_spending_evidence"
          sensitivity_required: true
          base_case_required: true
        public_pension_derivation:
          status: "reviewer_to_derive"
          decision_owner: "independent_monthly_reviewer"
          method: "estimate a transparent range and one base case from official Japanese pension information and the confirmed employment period; do not claim Nenkin Net precision"
          evidence_requirements:
            - "official_Japanese_pension_sources"
            - "explicit_limitations_from_missing_wage_history"
          sensitivity_required: true
          base_case_required: true
        terminal_asset_floor_derivation:
          status: "reviewer_to_derive"
          decision_owner: "independent_monthly_reviewer"
          method: "derive a terminal floor that supports longevity and late-life uncertainty without inventing an unconfirmed bequest motive"
          evidence_requirements:
            - "planning_end_age_and_lifestyle_preservation_objective"
            - "explicit_late_life_uncertainty_rationale"
          sensitivity_required: true
          base_case_required: true
      maximize_ex_ante_sharpe_ratio:
        risk_free_rate_definition: null
        return_basis: null
        horizon_years: null

