input_resolution_contract:
  repository_first_order:
    - "basis.snapshot_ref"
    - "financial/current.yaml"
    - "holdings/current.yaml"
    - "strategy/current.yaml"
    - "この計画内のreference_targets_at_basisとtask実績"
    - "transactions/"
  availability_values:
    resolved_from_repository: "正本に基準値があり、ユーザへの再提出要求は禁止"
    known_event_pending: "既存注文、受渡、依存タスク等の具体的イベント完了待ち"
    refresh_by_codex: "最新価格、為替、政策分母等をCodexが必要段階で更新"
    verify_at_execution: "下書きを止めず、具体的注文を入力する段階で共通確認"
    user_input_blocking: "正本・接続済み情報源に存在せず、下書きまたは承認に本当に不可欠"
  stable_state_rule: >
    最新正本後の取引・移管・注文報告、既知イベント、矛盾する証拠がなければ、保有数量等は
    下書き計算用に継続しているものとして扱う。論理的な変更可能性だけで否定確認を求めない。
  user_request_rule: >
    ユーザ確認は具体的trigger_evidenceがあるknown_event_pending、またはrepository-first探索後も
    解決できないuser_input_blockingに限定する。verify_at_executionは現在のユーザ宿題にしない。
  common_order_entry_preflight:
    blocking_draft: false
    verification_stage: "order_entry"
    applies_to: "all_buy_and_sell_tasks"
    checks:
      - "現在保有数量または買付可能数量"
      - "重複する未反映注文"
      - "拘束数量・拘束資金"
      - "注文画面で利用可能な注文種別と有効期限"
    trigger_evidence: "具体的注文案をユーザが承認し、証券会社・取引サービスの注文画面へ入力する"

