    - single_security_cap_pct
    candidate_value_rule: Codexの既存比率や保有銘柄を候補値の根拠にせず、65歳時点の利益、分散、費用、税、売買回転、趣味としての正の配分制約から独立に候補を作る
    selection_output_path: strategic_policy_decision.active_risk_policy
  candidate_grid:
