      base_case_required: true
      sensitivity_required: false
      same_value_for_all_candidates: true
    rebalancing_frequency:
      value: null
      status: reviewer_to_derive
      decision_owner: independent_on_demand_reviewer
      selection_criteria: 費用、税、ドリフト管理を踏まえた一つの共通頻度
      allowed_primary_sources:
      - academic_primary_research
      - regulator
      base_case_required: true
      sensitivity_required: true
      same_value_for_all_candidates: true
  common_assumptions_rule: 全委譲項目を市場データ評価より先に一つのベースケースへ固定し、同じ前提を全候補へ適用する
  required_return_calculation_contract:
    currency_and_price_basis: snapshot-date current JPY
    return_basis: real_after_product_cost_before_personal_tax
    period: monthly
    cash_flow_timing: B_t = B_(t-1)*(1+r_annual)^(1/12) + C_t + P_t - S_t - L_t -
      T_t; all end-of-month, with exact boundary dates prorated only for partial months
    initial_balance_rule: long_term_investable_portfolio_jpy after household reserve,
      tactical liquidity, and noninvestable exclusions; mortgage principal is not
      deducted
    cash_flow_columns:
    - date
    - opening_balance_current_jpy
    - net_contribution_after_tax_current_jpy
    - public_pension_after_tax_current_jpy
    - retirement_spending_current_jpy
    - liability_payment_current_jpy
    - personal_tax_and_transaction_cost_current_jpy
    - closing_balance_current_jpy
    cost_double_count_prevention: fund expense ratios and recurring product costs
      are embedded once in r; personal taxes and transaction-specific costs are included
      once in T_t
    account_rules: NISA tax-free treatment, iDeCo contribution/withdrawal tax treatment,
      and taxable account realization taxes are modeled separately then aggregated
      on the same after-tax basis
    liability_rule: use liability_cash_flows; do not both subtract mortgage principal
      from current assets and include future repayments
    root_finding: solve closing_balance(planning_end_date)-terminal_asset_floor_current_jpy=0
      by bisection on annual real return [-99%, 100%], tolerance 0.0001 percentage
      points; if no sign change return status=not_calculable with reason and remediation
  success_probability_calculation_contract:
    method: parametric_multivariate_monthly_log_return_monte_carlo
    period: monthly
    trials: 50000
    random_seed_rule: integer YYYYMMDD from decision_date in Asia/Tokyo
    required_parameters:
    - equity_expected_return
    - bond_expected_return
    - other_expected_return
    - volatilities
    - correlation_matrix
    - inflation_base_case
    cash_flow_and_account_rule: use the same contribution, withdrawal, pension, mortgage,
      tax, cost, and timing assumptions as the required-return calculation
    rebalancing_rule: use the one common reviewer-derived frequency and apply taxes/costs
      consistently
    sequence_risk_rule: draw a new correlated monthly return vector each period and
      apply returns before the common end-of-month cash flows
    log_return_parameterization: for annual arithmetic mean mu and annual covariance
      Sigma, use monthly log covariance Sigma/12 and monthly log mean (ln(1+mu)-0.5*diag(Sigma))/12
    success_definition: balance never falls below zero before planning_end_date and
      closing balance is at least terminal_asset_floor_current_jpy
    candidate_feasibility_rule: estimated_success_probability_pct >= required_success_probability_pct
      and all hard allocation, concentration, leverage, and implementation constraints
      pass
    sensitivity_required: true
  primary_objective_fit_definition:
    minimize_risk_for_required_return: among candidate_feasible=true candidates, minimize
      expected_volatility_pct; tie-break by estimated_major_drawdown_pct closest to
      zero, then lower cost
    maximize_terminal_wealth: maximize configured after-tax real investment profit
      at age 65 under the same lifestyle-sustainable contribution and feasibility
      constraints
    maximize_ex_ante_sharpe_ratio: maximize common-basis ex-ante Sharpe ratio under
      the same feasibility constraints
