    x-additional-validation:
    - review_completion_status is derived from the three stage statuses and validation
      results; it is not a self-selected success label
    - complete_with_execution_blocks is allowed when strategic policy is complete
      but tax, cost-basis, or lot-detail execution is blocked or not_calculable; it
      cannot bypass the pre-generation account-category gate
    - quality checks are evidence based and are not required to all be pass
    - JSON Schema validation and semantic_validation_checks are separate steps
    - recommendation_window.start_at must equal packet_generated_at and end_at must
      be later than start_at
    - next_review_recommendation.review_after_at must not be before recommendation_window.end_at
      in Asia/Tokyo
    - all executable and conditional action timing must be concrete and fall within
      recommendation_window
    $defs:
      execution_capability_gate:
        type: object
        additionalProperties: false
        required:
        - gate_status
        - evaluated_before_calculations
        - capabilities
        properties:
          gate_status:
            enum:
            - all_available
            - partial
            - unavailable
          evaluated_before_calculations:
            const: true
          capabilities:
            type: array
            minItems: 8
            maxItems: 8
            items:
              $ref: '#/$defs/capability_result'
        x-additional-validation:
        - capability_id must be unique and cover all eight required capabilities exactly
          once
        - gate_status=all_available only when every capability is available
        - unavailable or partial capabilities must not be used to fabricate dependent
          numbers
      capability_result:
        type: object
        additionalProperties: false
        required:
        - capability_id
        - status
        - evidence
        - reason
        - missing_capability
        - remediation
        properties:
          capability_id:
            enum:
            - monthly_cash_flow_calculation
            - bisection_required_return_calculation
            - multivariate_monthly_monte_carlo
            - fixed_random_seed
            - complete_11_candidate_comparison
            - interest_rate_sensitivity_calculation
            - candidate_allocation_order_arithmetic_reconciliation
            - yaml_or_json_schema_validation
          status:
            enum:
            - available
            - partial
            - unavailable
          evidence:
            type: string
          reason:
            type: string
          missing_capability:
            type: array
            items:
              type: string
          remediation:
            type: string
        allOf:
        - if:
            properties:
              status:
                enum:
                - partial
                - unavailable
          then:
            properties:
              reason:
                type: string
                minLength: 1
              missing_capability:
                type: array
                minItems: 1
              remediation:
                type: string
                minLength: 1
        - if:
            properties:
              status:
                const: available
          then:
            properties:
              evidence:
                type: string
                minLength: 1
              missing_capability:
                type: array
                maxItems: 0
