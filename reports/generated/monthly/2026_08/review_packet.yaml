rule_registry:
- rule_id: R-PHASE-001
  applies_to: all
  rule: objective_confirmationでは目的確認の一問だけを出力し、Web調査、投資判断、6セクション、YAML、売買案、quality checksを出力しない。回答後はfinal_reviewへ移る
- rule_id: R-MODE-001
  applies_to: all
  rule: 一つのreview_mode内でstrategic_policy_stageを先に完了し、その結果だけをimplementation_stageへ渡す。戦略根拠と実装根拠を別フィールドに記録し、市場状況や現保有から戦略配分を逆算しない
- rule_id: R-OBJECTIVE-001
  applies_to: strategic_policy_second_opinion
  rule: primary_objectiveと対応するprimary_objective_fit_formulaで全候補を比較し、一つのベースケースを選ぶ
- rule_id: R-PLANNING-001
  applies_to: strategic_policy_second_opinion
  rule: reviewer_to_derive、reviewer_to_estimate_with_uncertainty、reviewer_to_model_with_uncertaintyは明示的な判断委譲として扱う。final_review内で根拠、式、限界、感応度と一つのベースケースを導出し、ユーザーへ再質問しない。導出値はfinancial_planning_modelだけを正本とする
- rule_id: R-PLANNING-002
  applies_to: strategic_policy_second_opinion
  rule: planning_timelineの日付を期間計算の正本とし、月次キャッシュフローで必要実質収益率と成功確率を再現する。整数年は表示用に限る
- rule_id: R-LIABILITY-001
  applies_to: strategic_policy_second_opinion
  rule: 住宅ローンはliability_cash_flowsで退職後も満期まで計上する。現在資産から元本控除する方式と将来返済方式を混在させず、現役期の控除後収入と二重計上しない
- rule_id: R-LIABILITY-002
  applies_to: strategic_policy_second_opinion
  rule: 銀行書類由来の住宅ローン元本、金利、返済額、返済日、満期を正本としてそのまま使う。一般的な元利均等返済式で入力間の算術的一致を再検証せず、推定不一致を理由に修正、警告またはblocked判定を行わない
- rule_id: R-CONTRIBUTION-001
  applies_to: strategic_policy_second_opinion
  rule: contribution_reconciliationを先に完成させ、iDeCo、NISA、crypto、temporary cash redeploymentとnew
    savingsを二重計上しない
- rule_id: R-CASH-001
  applies_to: all
  rule: 家計用現金、戦術的待機資金、長期運用資産を分離し、必要現金の残余から長期株式比率を逆算しない
- rule_id: R-CASH-002
  applies_to: all
  rule: tactical_liquidity_policyの正本はstrategic_policy_decision.tactical_liquidity_policyだけとし、cash_assessmentとdecisionsはID参照だけにする
- rule_id: R-MARKET-001
  applies_to: all
  rule: 市場下落判定は投入対象と同じ広範指数を使う。テーマ・セクター下落は発動条件にせず、必要データを確認できなければunclearとする
- rule_id: R-MARKET-002
  applies_to: final_review
  rule: 長期的根拠から投資待機資金政策を先に固定し、その後で当月市場へ適用する。当月値動きを理由にthresholdやlookbackを変更しない
- rule_id: R-CANDIDATE-001
  applies_to: strategic_policy_second_opinion
  rule: investable other比率を共通固定後、equity-bond sleeveの株式0～100%を10ポイント刻みで全件比較し、境界候補を選んだまま探索を省略しない
- rule_id: R-CANDIDATE-002
  applies_to: strategic_policy_second_opinion
  rule: tactical liquidityはhousehold_total_assets_jpyを分母とする0、2.5、5、7.5、10%を所定の成功確率、必要収益率、投入効果、現金保有コスト、複雑性、補充可能性で比較し、選択規則に従って一つを選んでから発動ルールを固定する
- rule_id: R-CANDIDATE-003
  applies_to: strategic_policy_second_opinion
  rule: other_pctは0、1、2、3、5%と暗号資産積立の3選択肢を比較し、通常月収支、必要成功確率、分散効果、資金源、低比率優先の順で一つを選んだ後にequity-bond
    sleeve 11候補を比較する。現在の暗号資産残高は推測しない
- rule_id: R-SEMICON-001
  applies_to: final_review
  rule: current_approved_constraintとproposed_future_policyを分離し、新上限が承認されるまでは現行policy_idを執行制約として各売買案へ記録する
- rule_id: R-RESEARCH-001
  applies_to: final_review
  rule: accessed_atはresearch_cutoff_at後でもよい。判断に使う情報はpublication_date、filing/release
    date、data_as_ofをaccessed_atと分離し、公表日時がcutoff以前であることを確認する。公表日時不明の動的ページとcutoff後公表情報は判断に使わず、portfolio_snapshot_as_ofの評価額を再評価しない
- rule_id: R-STORY-001
  applies_to: final_review
  rule: security_story_review_targetsとthematic_fund_review_targetsを全件評価し、価格変動だけを売却理由にしない
- rule_id: R-THEME-001
  applies_to: final_review
  rule: 同一テーマ投信は商品・指数ストーリーを一度だけ評価し、口座・ロット別の税務と執行判断を別配列へ記録する
- rule_id: R-TRADE-001
  applies_to: final_review
  rule: 売買・資金移動は算式、型付き入力、仮定への依存、税・口座、最大影響、実行時期を示し、承認済み根拠のない金額閾値は追加しない
- rule_id: R-TRADE-002
  applies_to: final_review
  rule: 戦略目標、商品単位方針、口座・ロット注文を別レイヤーで判定する。口座区分は生成前に全件確認し、税額・取得価額・ロット詳細の不足だけを該当ロット執行のblocked理由として扱う
- rule_id: R-TAX-001
  applies_to: final_review
  rule: 保有銘柄の売却を一件でも提案する場合は、日本の最新税制の一次情報に基づき、課税口座の含み益ロットと含み損ロットを同一暦年に実現して譲渡益を相殺する損益通算（tax-loss
    harvesting）を必ず比較する。当年の確定損益、利用可能な繰越損失、配当等との通算可否、口座区分、NISA内損失は損益通算・繰越控除できない点、概算税効果、手数料、再取得までの価格変動リスク、申告実務を確認し、税効果だけで投資判断を歪めない。採用しない場合も理由をaccount_tax_comparisonsへ記録する
- rule_id: R-WINDOW-001
  applies_to: final_review
  rule: recommendation_windowはpacket_generated_atを始点とし、データ鮮度、イベント日程、予測可能性、実行可能性からreviewerがdays、weeks、monthsの尺度と長さを選ぶ。全推奨行動のtimingをその範囲内へ具体化する
- rule_id: R-REVIEW-001
  applies_to: final_review
  rule: next_review_recommendationはrecommendation_window終了以前に設定せず、早期再レビュー条件と最新スナップショットによる次回依頼文を回答末尾に置く
- rule_id: R-ID-001
  applies_to: final_review
  rule: 人間向け回答では正式名称を使い、machine_id・symbol・銘柄コードはCodex向けYAMLの識別子フィールドに限定する
- rule_id: R-DELIVERY-001
  applies_to: final_review
  rule: ファイル生成可能ならreview_response.yamlを添付する。不可なら6セクション後の区切り線直後にYAMLコードブロックを一つだけ置く。YAMLファイル本体にはコードフェンスや説明文を入れない
- rule_id: R-QUALITY-001
  applies_to: final_review
  rule: quality checkはpass、fail、not_verifiable、not_applicableから検証結果どおりに選ぶ。passにも具体的なYAML
    path、式、件数または値のevidenceを記録し、確認不能事項をpassにしない。JSON Schema検証とsemantic_validation_checksを分離する
- rule_id: R-CAPABILITY-001
  applies_to: final_review
  rule: execution_capability_gateを計算前に完了する。利用不能な能力に依存する数値はnot_calculableとしてreason、missing_capability、remediationを記録し、計算可能な項目と定性的判断は続行する
- rule_id: R-ROUNDING-001
  applies_to: final_review
  rule: 金額±10円、比率±0.02ポイント、モンテカルロ確率±0.01ポイント、収益率・ボラティリティ±0.01ポイントを照合許容差とし、範囲内の差はrounding
    residualとして記録してfailまたはblockedにしない
research_contract:
  phase: final_review_only
  required_for:
  - capital_market_assumptions
  - financial_planning_assumptions
  - public_pension_estimation
  - retirement_spending_and_success_probability
  - tax_and_account_rules
  - product_specifications
  - security_story_reviews
  - thematic_fund_reviews
  preferred_source_types:
  - academic_primary_research
  - government_or_regulator
  - index_provider
  - fund_manager
  - issuer_ir_or_filing
  source_required_fields:
  - title
  - publisher
  - url
  - publication_date
  - data_as_of
  - accessed_at
  - cutoff_compliance_status
  - source_type
  - claim_supported
  cutoff_compliance_rules:
  - accessed_at may be later than research_cutoff_at and is not cutoff evidence
  - publication_date means publication, filing, or release date/time and must be at
    or before research_cutoff_at
  - data_as_of, when present, must be at or before research_cutoff_at but cannot cure
    a later publication_date
  - a dynamic page without a verifiable publication, filing, or release date is not_verifiable
    and must not support a decision
  - information published after research_cutoff_at is non_compliant even when it covers
    an earlier period
  portfolio_valuation_rule: 外部情報は判断根拠にだけ使い、portfolio_snapshot_as_ofの価格・為替・評価額・比率を更新しない
validation_contract:
  quality_check_schema:
    required_fields:
    - check_id
    - status
    - evidence
    - reason
    - remediation
    status_enum:
    - pass
    - fail
    - not_verifiable
    - not_applicable
    pass_evidence_rule: passにも検証した具体的なYAML path、式、件数または値を記録する
    unknown_rule: 確認できない事項をpassにしない
  required_check_ids:
  - target_equity_ratio_is_not_cash_residual
  - strategic_cash_and_tactical_cash_are_separated
  - one_primary_policy_is_selected
  - policy_is_derived_from_stated_objective
  - age_and_horizon_are_considered_when_relevant
  - age_is_not_replaced_by_an_unexamined_rule_of_thumb
  - empirical_rules_have_verifiable_support
  - statistical_average_is_not_presented_as_a_certain_outcome
  - no_persona_generated_investment_lore
  - no_numeric_threshold_is_based_only_on_expert_sounding_language
  - subjective_axes_are_used_only_when_explicitly_authorized
  - no_unrequested_psychological_or_lifestyle_axes
  - no_ad_hoc_concentration_limit
  - no_arbitrary_partial_sale
  - every_general_statement_supports_a_decision
  - transition_plan_matches_policy_portfolio
  - prior_recommendations_are_explicitly_superseded_when_changed
  - delegated_financial_planning_inputs_are_derived_not_reasked
  - derived_financial_planning_values_have_evidence_and_sensitivity
  - date_timeline_is_canonical_and_cash_flows_do_not_overlap
  - retirement_mortgage_cash_flows_are_included_without_double_counting
  - recurring_contributions_are_reconciled_before_policy_derivation
  - capital_market_assumptions_are_complete_and_common_to_all_candidates
  - required_return_calculation_is_reproducible
  - success_probability_calculation_is_reproducible
  - candidate_grid_is_exhaustive_and_not_stopped_at_a_selected_boundary
  - equity_bond_other_and_core_satellite_denominators_are_consistent
  - approved_and_proposed_semiconductor_limits_are_separated
  - strategic_policy_implementation_and_account_lot_statuses_are_separated
  - strategic_policy_precedes_implementation
  - tactical_liquidity_candidates_follow_finite_grid_and_selection_rule
  - other_pct_and_crypto_options_follow_finite_grids_and_selection_rule
  - tactical_liquidity_policy_is_locked_before_current_market_evaluation
  - execution_capability_gate_prevents_fabricated_calculations
  - rounding_residuals_use_explicit_tolerances
  - mortgage_source_values_are_used_without_generic_revalidation
  - recommendation_window_is_reviewer_selected_and_actionable
  - next_review_recommendation_matches_the_window
  phase_rule: objective_confirmationではquality checksを出力しない。final_reviewでは各checkを実測結果に従って判定し、自己申告でpassへ揃えない
  static_reference_checks:
  - no_undefined_packet_reference
  - no_deprecated_date_alias
  - no_unapproved_material_trade_threshold
  - one_canonical_tactical_liquidity_policy
  - allocation_percentages_total_100
  - no_machine_ids_in_human_sections
  - no_external_response_schema_reference
  - selected_recurring_source_is_versioned
  - no_inactive_750000_monthly_constraint
  - all_root_arrays_have_inline_schema
  static_reference_check_rule: final_reviewのroot static_reference_checksへ全IDを一度ずつ出力する。各checkはpass、fail、not_verifiable、not_applicableを使い分け、evidence、reason、remediationを記録する
  standard_json_schema_scope:
  - required_fields
  - data_types
  - enums
  - array_shapes
  - explicit_nullability
  - numeric_ranges
  semantic_validation_check_ids:
  - candidate_id_values_are_unique
  - check_id_values_are_unique
  - tactical_liquidity_grid_has_5_required_rows
  - other_pct_grid_has_5_required_rows
  - crypto_option_grid_has_3_required_rows
  - equity_bond_candidate_grid_has_11_required_rows
  - allocation_weights_total_100_within_tolerance
  - exactly_one_policy_candidate_is_selected
  - selected_policy_candidate_is_feasible
  - all_review_targets_appear_exactly_once
  - holding_values_reconcile_to_total_assets
  - before_after_amounts_reconcile
  - purchase_amounts_reconcile_to_funding_sources
  - sale_amounts_reconcile_to_sale_details
  - strategic_policy_precedes_implementation
  - recommendation_window_starts_at_request_and_has_positive_duration
  - next_review_date_is_not_before_recommendation_window_end
  semantic_validation_rule: ID一意性、候補集合、選択数、feasibility、クロスフィールド算術、全対象coverage、資金源照合、売却明細照合、二段階順序はJSON
    Schemaだけで検証済みとみなさずsemantic_validation_checksへ具体値と許容差を記録する
  numeric_tolerances:
    amount_jpy: 10
    percentage_points: 0.02
    monte_carlo_probability_pct_points: 0.01
    return_and_volatility_pct_points: 0.01
  rounding_rule: 許容差以内の差はrounding_residualとして記録しfailまたはblockedにしない。超過時だけfailまたはnot_verifiableにする
  review_completion_status_enum:
  - complete
  - complete_with_execution_blocks
  - blocked
  - invalid
  completion_rule: 口座区分は全件確認済みであることを前提とする。税額、取得価額またはロット詳細だけがblockedまたはnot_calculableならcomplete_with_execution_blocksを使用する。戦略判断に不可欠な計算が成立しない場合だけstrategic
    policyをblockedにする
  interaction_phase_at_generation: final_review
