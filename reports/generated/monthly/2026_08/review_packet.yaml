  - expected_volatility_pct
  - equity_bond_correlation
  - estimated_major_drawdown_pct
  - estimated_success_probability_pct
  - required_success_probability_pct
  - candidate_feasible
  - constraint_failures
  - primary_objective_fit_value
  - primary_objective_fit_formula
  - assumptions_ref
