    - 100
    other_pct_rule: other_pct_candidatesとcrypto_contribution_optionsを選択規則で比較して一つの共通比率を先に決め、全候補へ同じother_pctを使う。残るequity-bond
      sleeveを0～100%の10ポイント刻みで完全比較する
    candidate_weight_formula: total_equity_pct=(100-other_pct)*sleeve_equity_pct/100;
      bond_pct=(100-other_pct)*(100-sleeve_equity_pct)/100
    boundary_rule: 0%株式と100%株式を含む全11点を評価するため境界拡張は不要。評価した候補集合外を含む最小リスクとは表現しない
  assumption_delegations:
