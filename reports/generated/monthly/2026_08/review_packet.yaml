output_contract:
  interaction_phase: final_review
  objective_confirmation:
    response_type: one_objective_question_only
    optional_content: 各選択肢の一行定義
    forbidden:
    - web_research
    - investment_decision
    - seven_human_sections
    - yaml
    - trade_proposals
    - decision_quality_checks
    transition: ユーザーの一回答をupdated_inputsへ反映し、同じ初期入力全体でfinal_reviewを再実行する
  final_review:
    required_stage_order:
    - strategic_policy_stage
    - implementation_stage
    strategic_policy_stage_output: strategic_policy_decision
    implementation_stage_output: implementation_decision
    account_lot_execution_output: account_lot_execution
    stage_transition_rule: implementation_stageはstrategic_policy_decision.status=completeで確定した政策を参照して開始し、保有商品または当月市場から戦略配分を逆算しない
    required_sections:
    - 【推奨方針】
    - 【採用した決定規則】
    - 【具体的な売買・資金移動】
    - 【実行後配分】
    - 【実行前確認事項】
    - 【Codex向け改善フィードバック】
    - 【次回レビュー時期】
    updated_inputs_location: 【推奨方針】の冒頭。独立見出しは禁止
    human_section_rules: 一般論は判断根拠に必要な段落だけに限定する。測定不能な割合制限は使わない
    delivery:
      schema_authority: output_contract.inline_response_schema_only
      external_schema_reference_allowed: false
      preferred: attach_review_response_yaml
      fallback: six_sections_then_delimiter_then_one_yaml_code_block
      yaml_file_transport: コードフェンスなしの純粋なYAMLファイル
      chat_transport: 区切り線後の一つのyamlコードブロック
    decision_date_rule: ユーザー入力ではなく、final_reviewを生成したAsia/Tokyoの暦日をYYYY-MM-DDで記録する
    recommendation_window_rule: packet_generated_atを始点とし、reviewerが根拠を示してdays、weeks、monthsの単位と長さを選ぶ。全推奨行動はend_atまでの具体的な時期へ落とす
    next_review_rule: 次回レビュー日はrecommendation_window.end_at以前にせず、早期再レビュー条件と最新スナップショットを求める締めの一文を最終セクションに置く
  response_identity:
    schema_version: 2
    artifact_type: investment_review_response
    review_cadence: on_demand
    review_mode: strategic_policy_second_opinion
    interaction_phase: final_review
    review_target_month: '2026_08'
    portfolio_snapshot_as_of: '2026-08-09'
  canonical_paths:
    strategic_policy_stage: strategic_policy_decision
    implementation_stage: implementation_decision
    account_lot_execution: account_lot_execution
    tactical_liquidity_policy: strategic_policy_decision.tactical_liquidity_policy
    current_deployment_evaluation: dip_buy_liquidity_deployment_review
    cash_policy_reference: cash_assessment.tactical_liquidity_policy_ref
    decision_references: decisions.policy_refs
  inline_response_schema:
    $schema: https://json-schema.org/draft/2020-12/schema
    title: Machine-readable on-demand investment review response
    type: object
    additionalProperties: false
    x-nullability-rules:
    - each field's JSON Schema is the sole authority for whether null is allowed;
      there is no implicit containing-status nullability rule
    - where a field schema explicitly allows null, any narrower status-dependent rule
      is expressed by that object's if/then schema or by x-additional-validation
    - every blocked or not_calculable object governed by a status condition must include
      a non-empty reason and remediation
    - reviewer_to_derive inputs must be derived for strategic final_review unless
      the calculation contract proves them not_calculable
    - account categories must be complete before review generation; only later tax,
      cost-basis, or lot-detail gaps may block lot execution without blocking the
      strategic policy decision
    required:
    - schema_version
    - artifact_type
    - review_cadence
    - review_mode
    - interaction_phase
    - review_target_month
    - portfolio_snapshot_as_of
    - market_reference_as_of
    - packet_generated_at
    - research_cutoff_at
    - decision_date
    - recommendation_window
    - next_review_recommendation
    - review_completion_status
    - execution_capability_gate
    - strategic_policy_decision
    - implementation_decision
    - account_lot_execution
    - decision_axes
    - empirical_evidence
    - human_summary
    - cash_assessment
    - dip_buy_liquidity_deployment_review
    - security_story_reviews
    - thematic_fund_reviews
    - before_after_allocation
    - account_tax_comparisons
    - decisions
    - codex_handoff
    - decision_quality_checks
    - static_reference_checks
    - validation_tolerances
    - rounding_reconciliation
    - semantic_validation_checks
    properties:
      schema_version:
        const: 2
      artifact_type:
        const: investment_review_response
      review_cadence:
        const: on_demand
      review_mode:
        enum:
        - on_demand_operational_review
        - strategic_policy_second_opinion
      interaction_phase:
        const: final_review
      review_target_month:
        type: string
        pattern: ^[0-9]{4}_[0-9]{2}$
      portfolio_snapshot_as_of:
        type: string
        format: date
      market_reference_as_of:
        type: string
      packet_generated_at:
        type: string
        format: date-time
      research_cutoff_at:
        type: string
        format: date-time
      decision_date:
        type: string
        format: date
      recommendation_window:
        type: object
        additionalProperties: false
        required:
        - start_at
        - end_at
        - window_length
        - window_unit
        - selection_rationale
        - confidence_boundary
        properties:
          start_at:
            type: string
            format: date-time
          end_at:
            type: string
            format: date-time
          window_length:
            type: integer
            minimum: 1
          window_unit:
            enum:
            - days
            - weeks
            - months
          selection_rationale:
            type: string
            minLength: 1
          confidence_boundary:
            type: string
            minLength: 1
      next_review_recommendation:
        type: object
        additionalProperties: false
        required:
        - review_after_at
        - interval_value
        - interval_unit
        - rationale
        - early_review_triggers
        - closing_sentence
        properties:
          review_after_at:
            type: string
            format: date
          interval_value:
            type: integer
            minimum: 1
          interval_unit:
            enum:
            - days
            - weeks
            - months
          rationale:
            type: string
            minLength: 1
          early_review_triggers:
            type: array
            items:
              type: string
              minLength: 1
          closing_sentence:
            type: string
            pattern: ^また[1-9][0-9]*(日|週間|か月)後（[0-9]{4}-[0-9]{2}-[0-9]{2}）に最新のスナップショットをもとにレビュー依頼を出してください。$
      review_completion_status:
        enum:
        - complete
        - complete_with_execution_blocks
        - blocked
        - invalid
      execution_capability_gate:
        $ref: '#/$defs/execution_capability_gate'
      strategic_policy_decision:
        type: object
        additionalProperties: false
        required:
        - stage
        - status
        - reason
        - remediation
        - objective
        - updated_inputs
        - financial_planning_model
        - recommended_policy
        - policy_allocation_within_investable_portfolio
        - household_total_asset_allocation
        - tactical_liquidity_policy
        - active_risk_policy
        - direct_semiconductor_limit
        - tactical_liquidity_candidate_comparison
        - crypto_contribution_option_comparison
        - other_allocation_candidate_comparison
        - candidate_methodology
        - candidate_comparison
        properties:
          stage:
            const: strategic_policy_stage
          status:
            enum:
            - complete
            - not_applicable
            - blocked
          reason:
            type: string
          remediation:
            type: string
          objective:
            type:
            - string
            - 'null'
            enum:
            - maximize_terminal_wealth
            - minimize_risk_for_required_return
            - maximize_ex_ante_sharpe_ratio
            - null
          updated_inputs:
            $ref: '#/$defs/updated_inputs'
          financial_planning_model:
            $ref: '#/$defs/financial_planning_model'
          recommended_policy:
            oneOf:
            - $ref: '#/$defs/recommended_policy'
            - $ref: '#/$defs/blocked_component'
            - type: 'null'
          policy_allocation_within_investable_portfolio:
            oneOf:
            - $ref: '#/$defs/allocation_view'
            - $ref: '#/$defs/blocked_component'
            - type: 'null'
          household_total_asset_allocation:
            oneOf:
            - $ref: '#/$defs/household_allocation_view'
            - $ref: '#/$defs/blocked_component'
            - type: 'null'
          tactical_liquidity_policy:
            $ref: '#/$defs/tactical_liquidity_policy'
          active_risk_policy:
            oneOf:
            - $ref: '#/$defs/active_risk_policy'
            - $ref: '#/$defs/blocked_component'
            - type: 'null'
          direct_semiconductor_limit:
            $ref: '#/$defs/direct_semiconductor_limit'
          tactical_liquidity_candidate_comparison:
            type: array
            items:
              $ref: '#/$defs/tactical_liquidity_candidate'
          crypto_contribution_option_comparison:
            type: array
            items:
              $ref: '#/$defs/crypto_contribution_option'
          other_allocation_candidate_comparison:
            type: array
            items:
              $ref: '#/$defs/other_allocation_candidate'
          candidate_methodology:
            oneOf:
            - $ref: '#/$defs/candidate_methodology'
            - $ref: '#/$defs/blocked_component'
            - type: 'null'
          candidate_comparison:
            type: array
            items:
              $ref: '#/$defs/candidate'
            x-additional-validation:
            - the 11 sleeve_equity_pct values must be exactly 0, 10, ..., 100 once
              each and must match candidate_methodology.candidate_grid when methodology
              is complete
            - candidate_id must be unique
            - all numeric other_pct values must equal candidate_methodology.other_pct_common_base_case
            - total_equity_pct=(100-other_pct)*sleeve_equity_pct/100 and bond_pct=(100-other_pct)*(100-sleeve_equity_pct)/100
            - a completed response selects exactly one feasible candidate; a blocked
              response may select none only when it gives an upper-level reason and
              remediation
        allOf:
        - if:
            properties:
              status:
                const: complete
          then:
            properties:
              reason:
                type: string
                minLength: 1
              recommended_policy:
                $ref: '#/$defs/recommended_policy'
              policy_allocation_within_investable_portfolio:
                $ref: '#/$defs/allocation_view'
              household_total_asset_allocation:
                $ref: '#/$defs/household_allocation_view'
              active_risk_policy:
                $ref: '#/$defs/active_risk_policy'
              tactical_liquidity_candidate_comparison:
                type: array
                minItems: 5
                maxItems: 5
              crypto_contribution_option_comparison:
                type: array
                minItems: 3
                maxItems: 3
              other_allocation_candidate_comparison:
                type: array
                minItems: 5
                maxItems: 5
              candidate_methodology:
                $ref: '#/$defs/candidate_methodology'
              candidate_comparison:
                type: array
                minItems: 11
                maxItems: 11
        - if:
            properties:
              status:
                const: blocked
          then:
            properties:
              reason:
                type: string
                minLength: 1
              remediation:
                type: string
                minLength: 1
              tactical_liquidity_candidate_comparison:
                type: array
                minItems: 5
                maxItems: 5
              crypto_contribution_option_comparison:
                type: array
                minItems: 3
                maxItems: 3
              other_allocation_candidate_comparison:
                type: array
                minItems: 5
                maxItems: 5
              candidate_comparison:
                type: array
                minItems: 11
                maxItems: 11
        - if:
            properties:
              status:
                const: not_applicable
          then:
            properties:
              recommended_policy:
                type: 'null'
              policy_allocation_within_investable_portfolio:
                type: 'null'
              household_total_asset_allocation:
                type: 'null'
              active_risk_policy:
                type: 'null'
              tactical_liquidity_candidate_comparison:
                type: array
                maxItems: 0
              crypto_contribution_option_comparison:
                type: array
                maxItems: 0
              other_allocation_candidate_comparison:
                type: array
                maxItems: 0
              candidate_methodology:
                type: 'null'
              candidate_comparison:
                type: array
                maxItems: 0
      implementation_decision:
        $ref: '#/$defs/implementation_decision'
      account_lot_execution:
        $ref: '#/$defs/account_lot_execution'
      decision_axes:
        type: object
        additionalProperties: false
        required:
        - user_confirmed_facts
        - packet_confirmed_facts
        - empirical_market_evidence
        - mathematically_derived_constraints
        - reviewer_assumptions
        properties:
          user_confirmed_facts:
            type: array
          packet_confirmed_facts:
            type: array
          empirical_market_evidence:
            type: array
          mathematically_derived_constraints:
            type: array
          reviewer_assumptions:
            type: array
      empirical_evidence:
        type: array
        items:
          $ref: '#/$defs/empirical_evidence'
      human_summary:
        type: object
        additionalProperties: false
        required:
        - overall_assessment
        - priority_actions
        properties:
          overall_assessment:
            type: string
          priority_actions:
            type: array
            items:
              type: string
      cash_assessment:
        type: object
        additionalProperties: false
        required:
        - emergency_fund_target_jpy
        - emergency_fund_status
        - monthly_essential_expenses_jpy
        - spending_months
        - near_term_confirmed_expenses_jpy
        - contingency_reserve_jpy
        - tactical_liquidity_policy_ref
        - dip_buy_liquidity_status
        - minimum_confirmed_cash_jpy
        - maximum_calculable_cash_jpy
        - total_cash_target_status
        - total_cash_target_jpy
        - calculation_reason
        - remediation
        - derivation_notes
        properties:
          emergency_fund_target_jpy:
            type:
            - number
            - 'null'
            minimum: 0
          emergency_fund_status:
            enum:
            - confirmed_user_target
            - calculated
            - not_calculable
          monthly_essential_expenses_jpy:
            type:
            - number
            - 'null'
            minimum: 0
          spending_months:
            type:
            - number
            - 'null'
            minimum: 0
          near_term_confirmed_expenses_jpy:
            type:
            - number
            - 'null'
            minimum: 0
          contingency_reserve_jpy:
            type:
            - number
            - 'null'
            minimum: 0
          tactical_liquidity_policy_ref:
            const: strategic_policy_decision.tactical_liquidity_policy
          dip_buy_liquidity_status:
            enum:
            - configured
            - target_calculated_deployment_unconfigured
            - unconfigured
            - pending_independent_second_opinion
            - proposal_requested_from_current_review
          minimum_confirmed_cash_jpy:
            type:
            - number
            - 'null'
            minimum: 0
          maximum_calculable_cash_jpy:
            type:
            - number
            - 'null'
            minimum: 0
          total_cash_target_status:
            enum:
            - fully_calculable
            - confirmed_minimum_only
            - not_calculable
          total_cash_target_jpy:
            type:
            - number
            - 'null'
            minimum: 0
          calculation_reason:
            type: string
          remediation:
            type: string
          derivation_notes:
            type: array
            items:
              type: string
      dip_buy_liquidity_deployment_review:
        $ref: '#/$defs/dip_buy_liquidity_deployment_review'
      security_story_reviews:
        type: array
        items:
          $ref: '#/$defs/security_story_review'
      thematic_fund_reviews:
        type: array
        items:
          $ref: '#/$defs/thematic_fund_review'
      before_after_allocation:
        type: array
        items:
          $ref: '#/$defs/before_after_allocation'
      account_tax_comparisons:
        type: array
        items:
          $ref: '#/$defs/account_tax_comparison'
      decisions:
        type: object
        additionalProperties: false
        required:
        - policy_refs
        - portfolio_diagnosis
        - rule_refs
        - order_proposals
        - actions
        - new_asset_purchase_conclusion
        properties:
          policy_refs:
            type: array
            uniqueItems: true
            items:
              type: string
          portfolio_diagnosis:
            type: array
            items:
              type: string
          rule_refs:
            type: array
            uniqueItems: true
            items:
              type: string
              pattern: ^R-[A-Z]+-[0-9]{3}$
          order_proposals:
            type: array
            items:
              $ref: '#/$defs/order_proposal'
          actions:
            type: array
            items:
              $ref: '#/$defs/action'
          new_asset_purchase_conclusion:
            type: object
            additionalProperties: false
            required:
            - status
            - rationale
            - action_ids
            properties:
              status:
                enum:
                - buy_proposed
                - no_new_asset_purchase
              rationale:
                type: string
                minLength: 1
              action_ids:
                type: array
                uniqueItems: true
                items:
                  type: string
      codex_handoff:
        type: object
        additionalProperties: false
        required:
        - execution_checks
        - prompt_feedback
        - repository_changes
        properties:
          execution_checks:
            type: array
            items:
              $ref: '#/$defs/execution_check'
          prompt_feedback:
            type: array
            items:
              $ref: '#/$defs/prompt_feedback'
          repository_changes:
            type: object
            additionalProperties: false
            required:
            - must
