$schema: "https://json-schema.org/draft/2020-12/schema"
title: "On-demand independent investment decision response"
type: object
additionalProperties: false
required:
  - schema_version
  - artifact_type
  - decision_id
  - completed_at
  - decision_status
  - recommendation
  - action_plan
  - evidence
  - alternatives
  - assumptions
  - unresolved_information
  - user_confirmation_required
  - prompt_feedback
properties:
  schema_version:
    const: 1
  artifact_type:
    const: "independent_investment_decision_response"
  decision_id:
    type: string
  completed_at:
    type: string
    format: date-time
  decision_status:
    enum:
      - determined
      - conditional
      - not_calculable
  recommendation:
    type: object
    additionalProperties: false
    required:
      - decision
      - rationale
      - parameter_values
      - formulas
      - review_triggers
    properties:
      decision:
        type: string
      rationale:
        type: string
      parameter_values:
        type: array
        items:
          type: object
          additionalProperties: false
          required: [name, value, unit]
          properties:
            name:
              type: string
            value: {}
            unit:
              type: string
      formulas:
        type: array
        items:
          type: string
      review_triggers:
        type: array
        items:
          type: string
  action_plan:
    type: object
    additionalProperties: false
    required: [applicability, rationale, existing_asset_sales, new_asset_purchases]
    properties:
      applicability: {enum: [applicable, not_applicable]}
      rationale: {type: string, minLength: 1}
      existing_asset_sales:
        type: array
        items: {$ref: "#/$defs/concrete_action"}
      new_asset_purchases:
        type: array
        items: {$ref: "#/$defs/concrete_action"}
  evidence:
    type: array
    items:
      type: object
      additionalProperties: false
      required: [title, url, as_of, finding, inference_use]
      properties:
        title:
          type: string
        url:
          type: string
          format: uri
        as_of:
          type: string
        finding:
          type: string
        inference_use:
          type: string
  alternatives:
    type: array
    items:
      type: object
      additionalProperties: false
      required: [description, switch_condition]
      properties:
        description:
          type: string
        switch_condition:
          type: string
  assumptions:
    type: array
    items:
      type: string
  unresolved_information:
    type: array
    items:
      type: string
  user_confirmation_required:
    const: true
  prompt_feedback:
    type: object
    additionalProperties: false
    required:
      - input_gaps
      - template_improvements
    properties:
      input_gaps:
        type: array
        items:
          type: string
      template_improvements:
        type: array
        items:
          type: string
$defs:
  concrete_action:
    type: object
    additionalProperties: false
    required: [symbol, asset_name, account_type, timing, execution_method, quantity, amount_jpy, formula, rationale, requires_user_approval]
    properties:
      symbol: {type: string}
      asset_name: {type: string, minLength: 1}
      account_type:
        type: string
        pattern: "(NISA|特定口座|一般口座)"
      timing: {type: string, minLength: 1}
      execution_method: {type: string, minLength: 1}
      quantity: {type: [number, "null"], minimum: 0}
      amount_jpy: {type: [number, "null"], minimum: 0}
      formula: {type: string, minLength: 1}
      rationale: {type: string, minLength: 1}
      requires_user_approval: {const: true}
