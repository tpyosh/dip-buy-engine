$schema: https://json-schema.org/draft/2020-12/schema
title: Codex internal evidence-backed review quality assessment (not a ChatGPT response format)
type: object
additionalProperties: false
required: [schema_version, source_ref, source_sha256, checks, holdings, majority_review]
properties:
  schema_version: {const: 1}
  source_ref: {type: string, minLength: 1}
  source_sha256: {type: string, pattern: '^[a-f0-9]{64}$'}
  checks:
    type: object
    additionalProperties: {$ref: '#/$defs/check'}
  holdings:
    type: array
    items:
      type: object
      additionalProperties: false
      required: [symbol, decision_class, action, rationale, comparison, timing, next_step, quantity, method, evidence_lines, unknowns]
      properties:
        symbol: {type: string, minLength: 1}
        decision_class: {enum: [ready, conditional, hold, deferred]}
        action: {type: [string, 'null']}
        rationale: {type: [string, 'null']}
        comparison: {type: [string, 'null']}
        timing: {type: [string, 'null']}
        next_step: {type: [string, 'null']}
        quantity: {type: [number, string, 'null']}
        method: {type: [string, 'null']}
        evidence_lines: {$ref: '#/$defs/lines'}
        unknowns:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [field, reason, impact, materiality, owner, verification, verify_by, branches]
            properties:
              field: {type: string, minLength: 1}
              reason: {type: [string, 'null']}
              impact: {enum: [decision, implementation, nonblocking]}
              materiality: {type: [string, 'null']}
              owner: {type: [string, 'null']}
              verification: {type: [string, 'null']}
              verify_by: {type: [string, 'null']}
              branches: {type: array, items: {type: string, minLength: 1}}
  majority_review:
    type: object
    additionalProperties: false
    required: [symbols, check]
    properties:
      symbols: {type: array, uniqueItems: true, items: {type: string}}
      check: {$ref: '#/$defs/check'}
$defs:
  lines:
    type: array
    minItems: 1
    uniqueItems: true
    items: {type: integer, minimum: 1}
  check:
    type: object
    additionalProperties: false
    required: [verdict, reason, evidence_lines]
    properties:
      verdict: {enum: [pass, fail, unknown]}
      reason: {type: string, minLength: 1}
      evidence_lines: {$ref: '#/$defs/lines'}
