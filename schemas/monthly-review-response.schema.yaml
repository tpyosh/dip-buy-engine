          properties: {calculation_status: {const: calculated}}
        then:
          properties:
            total_equity_pct: {type: number, minimum: 0, maximum: 100}
            bond_pct: {type: number, minimum: 0, maximum: 100}
            other_pct: {type: number, minimum: 0, maximum: 100}
            expected_nominal_return_pct: {type: number}
            expected_real_return_pct: {type: number}
            expected_volatility_pct: {type: number, minimum: 0}
            equity_bond_correlation: {type: number, minimum: -1, maximum: 1}
            estimated_major_drawdown_pct: {type: number}
            estimated_success_probability_pct: {type: number, minimum: 0, maximum: 100}
            required_success_probability_pct: {type: number, minimum: 0, maximum: 100}
            candidate_feasible: {type: boolean}
            primary_objective_fit_value: {type: [number, string]}
            primary_objective_fit_formula: {type: string, minLength: 1}
            assumptions_ref: {type: string, minLength: 1}
            missing_capability: {type: array, maxItems: 0}
      - if:
          properties: {calculation_status: {const: not_calculable}}
        then:
          properties:
            reason: {type: string, minLength: 1}
            missing_capability: {type: array, minItems: 1}
            remediation: {type: string, minLength: 1}
            selected: {const: false}
  empirical_evidence:
    type: object
    additionalProperties: false
    required: [evidence_id, claim, source, observed_market_or_population, observation_period, result, limitations, decision_supported]
    properties:
      evidence_id: {type: string}
      claim: {type: string}
      source: {$ref: "#/$defs/source"}
      observed_market_or_population: {type: string}
      observation_period: {type: string}
      result: {type: string}
      limitations: {type: string}
      decision_supported: {type: string}
  dip_buy_liquidity_deployment_review:
    type: object
    additionalProperties: false
    required: [policy_ref, policy_locked_before_market_evaluation, reserve_status, market_decline_status, trigger_index_matches_deployment_target, theme_or_sector_decline_used_as_trigger, market_evidence, use_option, selected_action, selection_rationale, reserve_maintenance_is_objective]
    properties:
      policy_ref: {const: strategic_policy_decision.tactical_liquidity_policy}
      policy_locked_before_market_evaluation: {type: [boolean, "null"]}
      reserve_status: {enum: [available, unavailable, unknown]}
      market_decline_status: {enum: [declining, not_declining, unclear]}
      trigger_index_matches_deployment_target: {type: [boolean, "null"]}
      theme_or_sector_decline_used_as_trigger: {const: false}
      market_evidence:
        type: array
        items: {$ref: "#/$defs/source"}
      use_option:
        type: object
        additionalProperties: false
        required: [considered, status, reason, remediation, target, amount_jpy, formula, timing, rationale]
        properties:
          considered: {type: boolean}
          status: {enum: [executable, conditional, not_calculable, not_applicable]}
          reason: {type: string}
          remediation: {type: string}
          target: {type: [string, "null"]}
          amount_jpy: {type: [number, "null"], minimum: 0}
          formula: {type: string}
          timing: {type: [string, "null"]}
          rationale: {type: string}
      selected_action: {enum: [use, hold, not_applicable, not_calculable]}
      selection_rationale: {type: string}
      reserve_maintenance_is_objective: {const: false}
  security_story_review:
    type: object
    additionalProperties: false
    required: [symbol, evaluated, thesis_status, provisional_story, material_facts, story_health, invalidation_signals, decision, decision_rationale, next_review_triggers, sources]
    properties:
      symbol: {type: string}
      evaluated: {type: boolean}
      thesis_status: {enum: [active, inherited_pending_review, missing]}
      provisional_story: {type: [string, "null"]}
      material_facts: {type: array, items: {type: string}}
      story_health: {enum: [healthy, watch, impaired, broken, insufficient_evidence]}
      invalidation_signals: {type: array, items: {type: string}}
      decision: {enum: [add, hold, reduce, exit, no_add_pending_thesis]}
      decision_rationale: {type: string}
      next_review_triggers: {type: array, items: {type: string}}
      sources: {type: array, items: {$ref: "#/$defs/source"}}
  thematic_fund_review:
    type: object
    additionalProperties: false
    required: [theme_review_id, product_name, member_symbols, index_story, material_facts, story_health, decision, decision_rationale, sources, account_lot_reviews]
    properties:
      theme_review_id: {type: string}
      product_name: {type: string}
      member_symbols: {type: array, minItems: 1, uniqueItems: true, items: {type: string}}
      index_story: {type: string}
      material_facts: {type: array, items: {type: string}}
      story_health: {enum: [healthy, watch, impaired, broken, insufficient_evidence]}
      decision: {enum: [add, hold, reduce, exit, no_add_pending_thesis]}
      decision_rationale: {type: string}
      sources: {type: array, items: {$ref: "#/$defs/source"}}
      account_lot_reviews:
        type: array
        items:
          type: object
          additionalProperties: false
          required: [symbol, account_type, execution_decision, tax_analysis_ref, rationale]
          properties:
            symbol: {type: string}
            account_type: {type: [string, "null"]}
            execution_decision: {enum: [buy, hold, reduce, exit, blocked_pending_account_confirmation]}
            tax_analysis_ref: {type: [string, "null"]}
            rationale: {type: string}
  before_after_allocation:
    type: object
    additionalProperties: false
    required: [view, category, before_jpy, after_jpy, target_jpy, before_pct, after_pct, target_pct, calculation_status, reason, remediation]
    properties:
      view: {enum: [policy_allocation_within_investable_portfolio, household_total_asset_allocation]}
      category: {type: string}
      before_jpy: {type: [number, "null"]}
      after_jpy: {type: [number, "null"]}
      target_jpy: {type: [number, "null"]}
      before_pct: {type: [number, "null"]}
      after_pct: {type: [number, "null"]}
      target_pct: {type: [number, "null"]}
      calculation_status: {enum: [calculated, not_calculable, not_applicable]}
      reason: {type: string}
      remediation: {type: string}
    allOf:
      - if:
          properties: {calculation_status: {const: not_calculable}}
        then:
          properties:
            reason: {type: string, minLength: 1}
            remediation: {type: string, minLength: 1}
  account_tax_comparison:
    type: object
    additionalProperties: false
    required: [comparison_id, symbol, account_type, status, reason, remediation, cost_basis_jpy, unrealized_gain_loss_jpy, tax_treatment, nisa_impact, estimated_after_tax_proceeds_jpy, decision, sources]
    properties:
      comparison_id: {type: string}
      symbol: {type: string}
      account_type: {type: [string, "null"]}
      status: {enum: [calculated, blocked, not_applicable]}
      reason: {type: string}
      remediation: {type: string}
      cost_basis_jpy: {type: [number, "null"]}
      unrealized_gain_loss_jpy: {type: [number, "null"]}
      tax_treatment: {type: string}
      nisa_impact: {type: string}
      estimated_after_tax_proceeds_jpy: {type: [number, "null"]}
      decision: {type: string}
      sources: {type: array, items: {$ref: "#/$defs/source"}}
    allOf:
      - if:
          properties: {status: {const: blocked}}
        then:
          properties:
            reason: {type: string, minLength: 1}
            remediation: {type: string, minLength: 1}
  typed_input:
    type: object
    additionalProperties: false
    required: [name, value, source_type, source_ref]
    properties:
      name: {type: string}
      value: {type: [string, number, boolean, "null"]}
      source_type: {enum: [confirmed_user_condition, observed_packet_fact, machine_calculation, evidence_based_inference, explicit_assumption]}
      source_ref: {type: string}
  order_proposal:
    type: object
    additionalProperties: false
    required: [proposal_id, proposal_level, symbol, account_type, side, status, reason, remediation, quantity, amount_jpy, formula, inputs, policy_refs, tax_and_account_analysis_ref, rationale, requires_user_approval]
    properties:
      proposal_id: {type: string}
      proposal_level: {enum: [strategic_exposure, product_amount, account_lot_order]}
      symbol: {type: string}
      account_type: {type: [string, "null"]}
      side: {enum: [buy, sell, transfer, hold]}
      status: {enum: [executable, conditional, blocked]}
      reason: {type: string}
      remediation: {type: string}
      quantity: {type: [number, "null"], minimum: 0}
      amount_jpy: {type: [number, "null"], minimum: 0}
      formula: {type: string}
      inputs: {type: array, items: {$ref: "#/$defs/typed_input"}}
      policy_refs: {type: array, minItems: 1, items: {type: string}}
      tax_and_account_analysis_ref: {type: [string, "null"]}
      rationale: {type: string}
      requires_user_approval: {const: true}
    allOf:
      - if:
          properties: {status: {enum: [conditional, blocked]}}
        then:
          properties:
            reason: {type: string, minLength: 1}
            remediation: {type: string, minLength: 1}
  action:
    type: object
    additionalProperties: false
    required: [action_id, action_scope, action_level, symbol, asset_name, holding_status, side, account_type, execution_method, status, reason, remediation, description, source, destination, quantity, amount_jpy, formula, inputs, policy_refs, assumption_independent_direction, confirmed_conditions_consistent, max_impact_if_assumptions_wrong_jpy, timing, rationale, requires_user_approval]
    properties:
      action_id: {type: string}
      action_scope: {enum: [existing_holding, new_asset]}
      action_level: {enum: [strategic_exposure, product_amount, account_lot_order]}
      symbol: {type: string}
      asset_name: {type: string, minLength: 1}
      holding_status: {enum: [held, not_held]}
      side: {enum: [buy, sell, hold, transfer]}
      account_type:
        type: string
        minLength: 1
        pattern: "(NISA|特定口座|一般口座)"
      execution_method: {type: string, minLength: 1}
      status: {enum: [executable, conditional, blocked]}
      reason: {type: string}
      remediation: {type: string}
      description: {type: string}
      source: {type: [string, "null"]}
      destination: {type: [string, "null"]}
      quantity: {type: [number, "null"], minimum: 0}
      amount_jpy: {type: [number, "null"], minimum: 0}
      formula: {type: string}
      inputs: {type: array, items: {$ref: "#/$defs/typed_input"}}
      policy_refs: {type: array, minItems: 1, items: {type: string}}
      assumption_independent_direction: {type: boolean}
      confirmed_conditions_consistent: {type: boolean}
      max_impact_if_assumptions_wrong_jpy: {type: [number, "null"], minimum: 0}
      timing: {type: string}
      rationale: {type: string}
      requires_user_approval: {const: true}
    allOf:
      - if:
          properties: {action_scope: {const: existing_holding}}
        then:
          properties: {holding_status: {const: held}, side: {enum: [sell, hold, transfer]}}
      - if:
          properties: {action_scope: {const: new_asset}}
        then:
          properties: {holding_status: {const: not_held}, side: {const: buy}}
      - if:
          properties: {status: {enum: [conditional, blocked]}}
        then:
          properties:
            reason: {type: string, minLength: 1}
            remediation: {type: string, minLength: 1}
  execution_check:
    type: object
    additionalProperties: false
    required: [check_id, status, evidence, blocking_action_ids]
    properties:
      check_id: {type: string}
      status: {enum: [pass, fail, not_applicable]}
      evidence: {type: string}
      blocking_action_ids: {type: array, items: {type: string}}
  prompt_feedback:
    type: object
    additionalProperties: false
    required: [feedback_id, category, severity, problem, recommended_change, affected_path]
    properties:
      feedback_id: {type: string}
      category: {enum: [input_gap, template, packet, schema, script]}
      severity: {enum: [must, should, nice_to_have]}
      problem: {type: string}
      recommended_change: {type: string}
      affected_path: {type: string}
  quality_check:
    type: object
    additionalProperties: false
    required: [check_id, status, evidence, reason, remediation]
    properties:
      check_id: {type: string}
      status: {enum: [pass, fail, not_verifiable, not_applicable]}
      evidence: {type: string}
      reason: {type: string}
      remediation: {type: string}
    allOf:
      - if:
          properties: {status: {const: pass}}
        then:
          properties:
            evidence: {type: string, minLength: 1}
      - if:
          properties: {status: {enum: [fail, not_verifiable]}}
        then:
          properties:
            reason: {type: string, minLength: 1}
            remediation: {type: string, minLength: 1}
      - if:
          properties: {status: {const: not_applicable}}
        then:
          properties:
            reason: {type: string, minLength: 1}
  decision_quality_check:
    allOf:
      - {$ref: "#/$defs/quality_check"}
      - type: object
        properties:
          check_id:
            enum:
              - target_equity_ratio_is_not_cash_residual
              - strategic_cash_and_tactical_cash_are_separated
              - one_primary_policy_is_selected
              - policy_is_derived_from_stated_objective
              - age_and_horizon_are_considered_when_relevant
              - age_is_not_replaced_by_an_unexamined_rule_of_thumb
              - empirical_rules_have_verifiable_support
              - statistical_average_is_not_presented_as_a_certain_outcome
              - no_persona_generated_investment_lore
              - no_numeric_threshold_is_based_only_on_expert_sounding_language
              - subjective_axes_are_used_only_when_explicitly_authorized
              - no_unrequested_psychological_or_lifestyle_axes
              - no_ad_hoc_concentration_limit
              - no_arbitrary_partial_sale
              - every_general_statement_supports_a_decision
              - transition_plan_matches_policy_portfolio
              - prior_recommendations_are_explicitly_superseded_when_changed
              - delegated_financial_planning_inputs_are_derived_not_reasked
              - derived_financial_planning_values_have_evidence_and_sensitivity
              - date_timeline_is_canonical_and_cash_flows_do_not_overlap
              - retirement_mortgage_cash_flows_are_included_without_double_counting
              - recurring_contributions_are_reconciled_before_policy_derivation
              - capital_market_assumptions_are_complete_and_common_to_all_candidates
              - required_return_calculation_is_reproducible
              - success_probability_calculation_is_reproducible
              - candidate_grid_is_exhaustive_and_not_stopped_at_a_selected_boundary
              - equity_bond_other_and_core_satellite_denominators_are_consistent
              - approved_and_proposed_semiconductor_limits_are_separated
              - strategic_policy_implementation_and_account_lot_statuses_are_separated
              - strategic_policy_precedes_implementation
              - tactical_liquidity_candidates_follow_finite_grid_and_selection_rule
              - other_pct_and_crypto_options_follow_finite_grids_and_selection_rule
              - tactical_liquidity_policy_is_locked_before_current_market_evaluation
              - execution_capability_gate_prevents_fabricated_calculations
              - rounding_residuals_use_explicit_tolerances
              - mortgage_source_values_are_used_without_generic_revalidation
  static_reference_check:
    allOf:
      - {$ref: "#/$defs/quality_check"}
      - type: object
        properties:
          check_id:
            enum:
              - no_undefined_packet_reference
              - no_deprecated_date_alias
              - no_unapproved_material_trade_threshold
              - one_canonical_tactical_liquidity_policy
              - allocation_percentages_total_100
              - no_machine_ids_in_human_sections
              - no_external_response_schema_reference
              - selected_recurring_source_is_versioned
              - no_inactive_750000_monthly_constraint
              - all_root_arrays_have_inline_schema
  validation_tolerances:
    type: object
    additionalProperties: false
    required: [rounding_tolerance_jpy, rounding_tolerance_pct_points, monte_carlo_probability_tolerance_pct_points, return_volatility_tolerance_pct_points]
    properties:
      rounding_tolerance_jpy: {const: 10}
      rounding_tolerance_pct_points: {const: 0.02}
      monte_carlo_probability_tolerance_pct_points: {const: 0.01}
      return_volatility_tolerance_pct_points: {const: 0.01}
  rounding_reconciliation:
    type: object
    additionalProperties: false
    required: [rounding_tolerance_jpy, rounding_tolerance_pct_points, rounding_residual_jpy, rounding_residual_pct_points, rounding_residual_treatment, evidence]
    properties:
      rounding_tolerance_jpy: {const: 10}
      rounding_tolerance_pct_points: {const: 0.02}
      rounding_residual_jpy: {type: number}
      rounding_residual_pct_points: {type: [number, "null"]}
      rounding_residual_treatment:
        enum:
          - within_tolerance_recorded
          - exceeds_tolerance_fail
          - exceeds_tolerance_not_verifiable
      evidence: {type: string, minLength: 1}
  semantic_validation_check:
    type: object
    additionalProperties: false
    required: [check_id, status, evidence, reason, remediation, observed_value, expected_value, difference, tolerance]
    properties:
      check_id:
        enum:
          - candidate_id_values_are_unique
          - check_id_values_are_unique
          - tactical_liquidity_grid_has_5_required_rows
          - other_pct_grid_has_5_required_rows
          - crypto_option_grid_has_3_required_rows
          - equity_bond_candidate_grid_has_11_required_rows
          - allocation_weights_total_100_within_tolerance
          - exactly_one_policy_candidate_is_selected
          - selected_policy_candidate_is_feasible
          - all_review_targets_appear_exactly_once
          - holding_values_reconcile_to_total_assets
          - before_after_amounts_reconcile
          - purchase_amounts_reconcile_to_funding_sources
          - sale_amounts_reconcile_to_sale_details
          - strategic_policy_precedes_implementation
      status: {enum: [pass, fail, not_verifiable, not_applicable]}
      evidence: {type: string}
      reason: {type: string}
      remediation: {type: string}
      observed_value: {type: [string, number, boolean, "null"]}
      expected_value: {type: [string, number, boolean, "null"]}
      difference: {type: [number, "null"]}
      tolerance: {type: [number, "null"], minimum: 0}
    allOf:
      - if:
          properties: {status: {const: pass}}
        then:
          properties:
            evidence: {type: string, minLength: 1}
      - if:
          properties: {status: {enum: [fail, not_verifiable]}}
        then:
          properties:
            reason: {type: string, minLength: 1}
            remediation: {type: string, minLength: 1}
