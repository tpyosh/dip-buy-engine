$schema: "https://json-schema.org/draft/2020-12/schema"
title: "Machine-readable monthly investment review response"
type: object
additionalProperties: false
x-nullability-rules:
  - "each field's JSON Schema is the sole authority for whether null is allowed; there is no implicit containing-status nullability rule"
  - "where a field schema explicitly allows null, any narrower status-dependent rule is expressed by that object's if/then schema or by x-additional-validation"
  - "every blocked or not_calculable object governed by a status condition must include a non-empty reason and remediation"
  - "reviewer_to_derive inputs must be derived for strategic final_review unless the calculation contract proves them not_calculable"
  - "account categories must be complete before review generation; only later tax, cost-basis, or lot-detail gaps may block lot execution without blocking the strategic policy decision"
required:
  - schema_version
  - artifact_type
  - review_mode
  - interaction_phase
  - review_target_month
  - portfolio_snapshot_as_of
  - market_reference_as_of
  - packet_generated_at
  - research_cutoff_at
  - decision_date
  - review_completion_status
  - execution_capability_gate
  - strategic_policy_decision
  - implementation_decision
  - account_lot_execution
  - decision_axes
  - empirical_evidence
  - human_summary
  - cash_assessment
  - dip_buy_liquidity_deployment_review
  - security_story_reviews
  - thematic_fund_reviews
  - before_after_allocation
  - account_tax_comparisons
  - decisions
  - codex_handoff
  - decision_quality_checks
  - static_reference_checks
  - validation_tolerances
  - rounding_reconciliation
  - semantic_validation_checks
properties:
  schema_version: {const: 2}
  artifact_type: {const: monthly_review_response}
  review_mode:
    enum: [monthly_operational_review, strategic_policy_second_opinion]
  interaction_phase: {const: final_review}
  review_target_month:
    type: string
    pattern: "^[0-9]{4}_[0-9]{2}$"
  portfolio_snapshot_as_of: {type: string, format: date}
  market_reference_as_of: {type: string}
  packet_generated_at: {type: string, format: date-time}
  research_cutoff_at: {type: string, format: date-time}
  decision_date: {type: string, format: date}
  review_completion_status:
    enum: [complete, complete_with_execution_blocks, blocked, invalid]
  execution_capability_gate: {$ref: "#/$defs/execution_capability_gate"}
  strategic_policy_decision:
    type: object
    additionalProperties: false
    required:
      - stage
      - status
      - reason
      - remediation
      - objective
      - updated_inputs
      - financial_planning_model
      - recommended_policy
      - policy_allocation_within_investable_portfolio
      - household_total_asset_allocation
      - tactical_liquidity_policy
      - active_risk_policy
      - direct_semiconductor_limit
      - tactical_liquidity_candidate_comparison
      - crypto_contribution_option_comparison
      - other_allocation_candidate_comparison
      - candidate_methodology
      - candidate_comparison
    properties:
      stage: {const: strategic_policy_stage}
      status: {enum: [complete, not_applicable, blocked]}
      reason: {type: string}
      remediation: {type: string}
      objective:
        type: [string, "null"]
        enum: [maximize_terminal_wealth, minimize_risk_for_required_return, maximize_ex_ante_sharpe_ratio, null]
      updated_inputs: {$ref: "#/$defs/updated_inputs"}
      financial_planning_model: {$ref: "#/$defs/financial_planning_model"}
      recommended_policy:
        oneOf:
          - {$ref: "#/$defs/recommended_policy"}
          - {$ref: "#/$defs/blocked_component"}
          - {type: "null"}
      policy_allocation_within_investable_portfolio:
        oneOf:
          - {$ref: "#/$defs/allocation_view"}
          - {$ref: "#/$defs/blocked_component"}
          - {type: "null"}
      household_total_asset_allocation:
        oneOf:
          - {$ref: "#/$defs/household_allocation_view"}
          - {$ref: "#/$defs/blocked_component"}
          - {type: "null"}
      tactical_liquidity_policy: {$ref: "#/$defs/tactical_liquidity_policy"}
      active_risk_policy:
        oneOf:
          - {$ref: "#/$defs/active_risk_policy"}
          - {$ref: "#/$defs/blocked_component"}
          - {type: "null"}
      direct_semiconductor_limit: {$ref: "#/$defs/direct_semiconductor_limit"}
      tactical_liquidity_candidate_comparison:
        type: array
        items: {$ref: "#/$defs/tactical_liquidity_candidate"}
      crypto_contribution_option_comparison:
        type: array
        items: {$ref: "#/$defs/crypto_contribution_option"}
      other_allocation_candidate_comparison:
        type: array
        items: {$ref: "#/$defs/other_allocation_candidate"}
      candidate_methodology:
        oneOf:
          - {$ref: "#/$defs/candidate_methodology"}
          - {$ref: "#/$defs/blocked_component"}
          - {type: "null"}
      candidate_comparison:
        type: array
        items: {$ref: "#/$defs/candidate"}
        x-additional-validation:
          - "the 11 sleeve_equity_pct values must be exactly 0, 10, ..., 100 once each and must match candidate_methodology.candidate_grid when methodology is complete"
          - "candidate_id must be unique"
          - "all numeric other_pct values must equal candidate_methodology.other_pct_common_base_case"
          - "total_equity_pct=(100-other_pct)*sleeve_equity_pct/100 and bond_pct=(100-other_pct)*(100-sleeve_equity_pct)/100"
          - "a completed response selects exactly one feasible candidate; a blocked response may select none only when it gives an upper-level reason and remediation"
    allOf:
      - if:
          properties: {status: {const: complete}}
        then:
          properties:
            reason: {type: string, minLength: 1}
            recommended_policy: {$ref: "#/$defs/recommended_policy"}
            policy_allocation_within_investable_portfolio: {$ref: "#/$defs/allocation_view"}
            household_total_asset_allocation: {$ref: "#/$defs/household_allocation_view"}
            active_risk_policy: {$ref: "#/$defs/active_risk_policy"}
            tactical_liquidity_candidate_comparison: {type: array, minItems: 5, maxItems: 5}
            crypto_contribution_option_comparison: {type: array, minItems: 3, maxItems: 3}
            other_allocation_candidate_comparison: {type: array, minItems: 5, maxItems: 5}
            candidate_methodology: {$ref: "#/$defs/candidate_methodology"}
            candidate_comparison: {type: array, minItems: 11, maxItems: 11}
      - if:
          properties: {status: {const: blocked}}
        then:
          properties:
            reason: {type: string, minLength: 1}
            remediation: {type: string, minLength: 1}
            tactical_liquidity_candidate_comparison: {type: array, minItems: 5, maxItems: 5}
            crypto_contribution_option_comparison: {type: array, minItems: 3, maxItems: 3}
            other_allocation_candidate_comparison: {type: array, minItems: 5, maxItems: 5}
            candidate_comparison: {type: array, minItems: 11, maxItems: 11}
      - if:
          properties: {status: {const: not_applicable}}
        then:
          properties:
            recommended_policy: {type: "null"}
            policy_allocation_within_investable_portfolio: {type: "null"}
            household_total_asset_allocation: {type: "null"}
            active_risk_policy: {type: "null"}
            tactical_liquidity_candidate_comparison: {type: array, maxItems: 0}
            crypto_contribution_option_comparison: {type: array, maxItems: 0}
            other_allocation_candidate_comparison: {type: array, maxItems: 0}
            candidate_methodology: {type: "null"}
            candidate_comparison: {type: array, maxItems: 0}
  implementation_decision: {$ref: "#/$defs/implementation_decision"}
  account_lot_execution: {$ref: "#/$defs/account_lot_execution"}
  decision_axes:
    type: object
    additionalProperties: false
    required: [user_confirmed_facts, packet_confirmed_facts, empirical_market_evidence, mathematically_derived_constraints, reviewer_assumptions]
    properties:
      user_confirmed_facts: {type: array}
      packet_confirmed_facts: {type: array}
      empirical_market_evidence: {type: array}
      mathematically_derived_constraints: {type: array}
      reviewer_assumptions: {type: array}
  empirical_evidence:
    type: array
    items: {$ref: "#/$defs/empirical_evidence"}
  human_summary:
    type: object
    additionalProperties: false
    required: [overall_assessment, priority_actions]
    properties:
      overall_assessment: {type: string}
      priority_actions:
        type: array
        items: {type: string}
  cash_assessment:
    type: object
    additionalProperties: false
    required:
      - emergency_fund_target_jpy
      - emergency_fund_status
      - monthly_essential_expenses_jpy
      - spending_months
      - near_term_confirmed_expenses_jpy
      - contingency_reserve_jpy
      - tactical_liquidity_policy_ref
      - dip_buy_liquidity_status
      - minimum_confirmed_cash_jpy
      - maximum_calculable_cash_jpy
      - total_cash_target_status
      - total_cash_target_jpy
      - calculation_reason
      - remediation
      - derivation_notes
    properties:
      emergency_fund_target_jpy: {type: [number, "null"], minimum: 0}
      emergency_fund_status: {enum: [confirmed_user_target, calculated, not_calculable]}
      monthly_essential_expenses_jpy: {type: [number, "null"], minimum: 0}
      spending_months: {type: [number, "null"], minimum: 0}
      near_term_confirmed_expenses_jpy: {type: [number, "null"], minimum: 0}
      contingency_reserve_jpy: {type: [number, "null"], minimum: 0}
      tactical_liquidity_policy_ref: {const: strategic_policy_decision.tactical_liquidity_policy}
      dip_buy_liquidity_status: {enum: [configured, target_calculated_deployment_unconfigured, unconfigured, pending_independent_second_opinion, proposal_requested_from_current_review]}
      minimum_confirmed_cash_jpy: {type: [number, "null"], minimum: 0}
      maximum_calculable_cash_jpy: {type: [number, "null"], minimum: 0}
      total_cash_target_status: {enum: [fully_calculable, confirmed_minimum_only, not_calculable]}
      total_cash_target_jpy: {type: [number, "null"], minimum: 0}
      calculation_reason: {type: string}
      remediation: {type: string}
      derivation_notes:
        type: array
        items: {type: string}
  dip_buy_liquidity_deployment_review:
    $ref: "#/$defs/dip_buy_liquidity_deployment_review"
  security_story_reviews:
    type: array
    items: {$ref: "#/$defs/security_story_review"}
  thematic_fund_reviews:
    type: array
    items: {$ref: "#/$defs/thematic_fund_review"}
  before_after_allocation:
    type: array
    items: {$ref: "#/$defs/before_after_allocation"}
  account_tax_comparisons:
    type: array
    items: {$ref: "#/$defs/account_tax_comparison"}
  decisions:
    type: object
    additionalProperties: false
    required: [policy_refs, portfolio_diagnosis, rule_refs, order_proposals, actions, new_asset_purchase_conclusion]
    properties:
      policy_refs:
        type: array
        uniqueItems: true
        items: {type: string}
      portfolio_diagnosis:
        type: array
        items: {type: string}
      rule_refs:
        type: array
        uniqueItems: true
        items: {type: string, pattern: "^R-[A-Z]+-[0-9]{3}$"}
      order_proposals:
        type: array
        items: {$ref: "#/$defs/order_proposal"}
      actions:
        type: array
        items: {$ref: "#/$defs/action"}
      new_asset_purchase_conclusion:
        type: object
        additionalProperties: false
        required: [status, rationale, action_ids]
        properties:
          status: {enum: [buy_proposed, no_new_asset_purchase]}
          rationale: {type: string, minLength: 1}
          action_ids:
            type: array
            uniqueItems: true
            items: {type: string}
  codex_handoff:
    type: object
    additionalProperties: false
    required: [execution_checks, prompt_feedback, repository_changes]
    properties:
      execution_checks:
        type: array
        items: {$ref: "#/$defs/execution_check"}
      prompt_feedback:
        type: array
        items: {$ref: "#/$defs/prompt_feedback"}
      repository_changes:
        type: object
        additionalProperties: false
        required: [must, should, nice_to_have]
        properties:
          must: {type: array, items: {type: string}}
          should: {type: array, items: {type: string}}
          nice_to_have: {type: array, items: {type: string}}
  decision_quality_checks:
    type: array
    minItems: 36
    maxItems: 36
    uniqueItems: true
    items: {$ref: "#/$defs/decision_quality_check"}
  static_reference_checks:
    type: array
    minItems: 10
    maxItems: 10
    uniqueItems: true
    items: {$ref: "#/$defs/static_reference_check"}
  validation_tolerances: {$ref: "#/$defs/validation_tolerances"}
  rounding_reconciliation: {$ref: "#/$defs/rounding_reconciliation"}
  semantic_validation_checks:
    type: array
    minItems: 15
    maxItems: 15
    uniqueItems: true
    items: {$ref: "#/$defs/semantic_validation_check"}
x-additional-validation:
  - "review_completion_status is derived from the three stage statuses and validation results; it is not a self-selected success label"
  - "complete_with_execution_blocks is allowed when strategic policy is complete but tax, cost-basis, or lot-detail execution is blocked or not_calculable; it cannot bypass the pre-generation account-category gate"
  - "quality checks are evidence based and are not required to all be pass"
  - "JSON Schema validation and semantic_validation_checks are separate steps"
$defs:
  execution_capability_gate:
    type: object
    additionalProperties: false
    required: [gate_status, evaluated_before_calculations, capabilities]
    properties:
      gate_status: {enum: [all_available, partial, unavailable]}
      evaluated_before_calculations: {const: true}
      capabilities:
        type: array
        minItems: 8
        maxItems: 8
        items: {$ref: "#/$defs/capability_result"}
    x-additional-validation:
      - "capability_id must be unique and cover all eight required capabilities exactly once"
      - "gate_status=all_available only when every capability is available"
      - "unavailable or partial capabilities must not be used to fabricate dependent numbers"
  capability_result:
    type: object
    additionalProperties: false
    required: [capability_id, status, evidence, reason, missing_capability, remediation]
    properties:
      capability_id:
        enum:
          - monthly_cash_flow_calculation
          - bisection_required_return_calculation
          - multivariate_monthly_monte_carlo
          - fixed_random_seed
          - complete_11_candidate_comparison
          - interest_rate_sensitivity_calculation
          - candidate_allocation_order_arithmetic_reconciliation
          - yaml_or_json_schema_validation
      status: {enum: [available, partial, unavailable]}
      evidence: {type: string}
      reason: {type: string}
      missing_capability: {type: array, items: {type: string}}
      remediation: {type: string}
    allOf:
      - if:
          properties: {status: {enum: [partial, unavailable]}}
        then:
          properties:
            reason: {type: string, minLength: 1}
            missing_capability: {type: array, minItems: 1}
            remediation: {type: string, minLength: 1}
      - if:
          properties: {status: {const: available}}
        then:
          properties:
            evidence: {type: string, minLength: 1}
            missing_capability: {type: array, maxItems: 0}
  implementation_decision:
    type: object
    additionalProperties: false
    required: [stage, status, reason, remediation, strategic_policy_ref, strategic_policy_status_at_start, strategy_locked_before_market_evaluation, product_decision_refs, tactical_deployment_ref, before_after_allocation_ref]
    properties:
      stage: {const: implementation_stage}
      status: {enum: [complete, partial, blocked, not_applicable]}
      reason: {type: string}
      remediation: {type: string}
      strategic_policy_ref: {const: strategic_policy_decision.recommended_policy}
      strategic_policy_status_at_start: {enum: [complete, not_applicable, blocked]}
      strategy_locked_before_market_evaluation: {type: [boolean, "null"]}
      product_decision_refs: {type: array, items: {type: string}}
      tactical_deployment_ref: {const: dip_buy_liquidity_deployment_review}
      before_after_allocation_ref: {const: before_after_allocation}
    allOf:
      - if:
          properties: {status: {enum: [complete, partial]}}
        then:
          properties:
            strategic_policy_status_at_start: {enum: [complete, not_applicable]}
            strategy_locked_before_market_evaluation: {const: true}
      - if:
          properties: {status: {enum: [partial, blocked]}}
        then:
          properties:
            reason: {type: string, minLength: 1}
            remediation: {type: string, minLength: 1}
  account_lot_execution:
    type: object
    additionalProperties: false
    required: [status, reason, remediation, implementation_decision_ref, missing_information, executable_order_proposal_ids, blocked_order_proposal_ids]
    properties:
      status: {enum: [complete, blocked, not_calculable, not_applicable]}
      reason: {type: string}
      remediation: {type: string}
      implementation_decision_ref: {const: implementation_decision}
      missing_information: {type: array, items: {type: string}}
      executable_order_proposal_ids: {type: array, uniqueItems: true, items: {type: string}}
      blocked_order_proposal_ids: {type: array, uniqueItems: true, items: {type: string}}
    allOf:
      - if:
          properties: {status: {enum: [blocked, not_calculable]}}
        then:
          properties:
            reason: {type: string, minLength: 1}
            remediation: {type: string, minLength: 1}
            missing_information: {type: array, minItems: 1}
  blocked_component:
    type: object
    additionalProperties: false
    required: [status, reason, remediation]
    properties:
      status: {const: blocked}
      reason: {type: string, minLength: 1}
      remediation: {type: string, minLength: 1}
  recommended_policy:
    type: object
    additionalProperties: false
    required: [policy_id, investable_equity_pct, investable_bond_pct, investable_other_pct, core_policy, satellite_policy, rebalancing_rule, transition_deadline]
    properties:
      policy_id: {type: string}
      investable_equity_pct: {type: number, minimum: 0, maximum: 100}
      investable_bond_pct: {type: number, minimum: 0, maximum: 100}
      investable_other_pct: {type: number, minimum: 0, maximum: 100}
      core_policy: {type: string}
      satellite_policy: {type: string}
      rebalancing_rule: {type: string}
      transition_deadline: {type: string}
  active_risk_policy:
    type: object
    additionalProperties: false
    required: [policy_id, satellites_allowed, satellite_target_pct_of_investable_portfolio, selected_satellite_securities, all_country_only_baseline_compared, selection_rationale, total_satellite_cap_pct, single_theme_cap_pct, single_security_cap_pct, exceptions]
    properties:
      policy_id: {type: string}
      satellites_allowed: {type: [boolean, "null"]}
      satellite_target_pct_of_investable_portfolio: {type: [number, "null"], minimum: 0, maximum: 100}
      selected_satellite_securities:
        type: array
        items:
          type: object
          additionalProperties: false
          required: [symbol, asset_name, role, target_pct_of_investable_portfolio, rationale]
          properties:
            symbol: {type: string}
            asset_name: {type: string}
            role: {type: string}
            target_pct_of_investable_portfolio: {type: number, exclusiveMinimum: 0, maximum: 100}
            rationale: {type: string}
      all_country_only_baseline_compared: {type: [boolean, "null"]}
      selection_rationale: {type: string}
      total_satellite_cap_pct: {type: [number, "null"], minimum: 0, maximum: 100}
      single_theme_cap_pct: {type: [number, "null"], minimum: 0, maximum: 100}
      single_security_cap_pct: {type: [number, "null"], minimum: 0, maximum: 100}
      exceptions: {type: array}
    allOf:
      - if:
          properties: {satellites_allowed: {const: true}}
        then:
          properties:
            satellite_target_pct_of_investable_portfolio: {type: number, exclusiveMinimum: 0, maximum: 100}
            selected_satellite_securities: {type: array, minItems: 1}
            all_country_only_baseline_compared: {const: true}
            selection_rationale: {type: string, minLength: 1}
  direct_semiconductor_limit:
    type: object
    additionalProperties: false
    required: [current_approved_constraint, proposed_future_policy, priority]
    properties:
      current_approved_constraint:
        type: object
        additionalProperties: false
        required: [policy_id, status, limit_pct, denominator, approved, rationale]
        properties:
          policy_id: {type: string}
          status: {const: hard_constraint}
          limit_pct: {type: number, minimum: 0, maximum: 100}
          denominator: {const: household_total_assets_jpy}
          approved: {const: true}
          rationale: {type: string}
      proposed_future_policy:
        type: object
        additionalProperties: false
        required: [policy_id, status, limit_pct, denominator, approved, rationale]
        properties:
          policy_id: {type: [string, "null"]}
          status: {enum: [proposed, not_applicable, blocked]}
          limit_pct: {type: [number, "null"], minimum: 0, maximum: 100}
          denominator: {const: household_total_assets_jpy}
          approved: {const: false}
          rationale: {type: string}
      priority: {type: string}
  source:
    type: object
    additionalProperties: false
    required: [title, publisher, url, publication_date, data_as_of, accessed_at, cutoff_compliance_status, source_type, claim_supported]
    properties:
      title: {type: string}
      publisher: {type: string}
      url: {type: string, format: uri}
      publication_date:
        description: "Publication, filing, or release date/time; this is distinct from accessed_at."
        anyOf:
          - {type: string, format: date}
          - {type: string, format: date-time}
          - {type: "null"}
      data_as_of:
        description: "Date/time represented by the data, when applicable; it does not override a later publication date."
        anyOf:
          - {type: string, format: date}
          - {type: string, format: date-time}
          - {type: "null"}
      accessed_at: {type: string, format: date-time}
      cutoff_compliance_status: {enum: [compliant, not_verifiable, non_compliant]}
      source_type: {type: string}
      claim_supported: {type: string}
    x-additional-validation:
      - "accessed_at may be later than research_cutoff_at and is never used as the cutoff evidence date"
      - "a source used for a decision must be cutoff_compliance_status=compliant"
      - "compliant requires a publication_date at or before research_cutoff_at; any supplied data_as_of must also be at or before the cutoff"
      - "a dynamic page whose publication, filing, or release date cannot be verified is not_verifiable and must not support a decision"
      - "information published after research_cutoff_at is non_compliant even when data_as_of covers an earlier period"
  updated_inputs:
    type: object
    additionalProperties: false
    required: [newly_confirmed, superseded_assumptions, decisions_now_unblocked, decisions_still_blocked]
    properties:
      newly_confirmed: {type: array, items: {type: string}}
      superseded_assumptions: {type: array, items: {type: string}}
      decisions_now_unblocked: {type: array, items: {type: string}}
      decisions_still_blocked: {type: array, items: {type: string}}
  financial_planning_model:
    type: object
    additionalProperties: false
    required:
      - status
      - reason
      - remediation
      - return_basis
      - current_age
      - withdrawal_start_age
      - planning_end_age
      - retirement_spending_current_jpy_per_month
      - retirement_spending_derivation
      - public_pension_annual_current_jpy
      - public_pension_estimation_method
      - long_term_contribution_policy
      - contribution_reconciliation
      - planning_timeline
      - liability_cash_flows
      - inheritance_included_in_base_case
      - inheritance_base_case_jpy
      - inheritance_treatment
      - terminal_asset_floor_current_jpy
      - success_probability_pct
      - success_probability_rationale
      - target_return_pct
      - target_return_formula
      - required_return_calculation
      - success_probability_calculation
      - sensitivity_cases
      - source_refs
    properties:
      status: {enum: [complete, partial, not_applicable, blocked]}
      reason: {type: string}
      remediation: {type: string}
      return_basis: {type: [string, "null"], enum: [real, nominal, null]}
      current_age: {type: [integer, "null"], minimum: 0}
      withdrawal_start_age: {type: [integer, "null"], minimum: 0}
      planning_end_age: {type: [integer, "null"], minimum: 0}
      retirement_spending_current_jpy_per_month: {type: [number, "null"], minimum: 0}
      retirement_spending_derivation: {type: [string, "null"]}
      public_pension_annual_current_jpy: {type: [number, "null"], minimum: 0}
      public_pension_estimation_method: {type: [string, "null"]}
      long_term_contribution_policy:
        type: object
        additionalProperties: false
