$schema: "https://json-schema.org/draft/2020-12/schema"
title: "Versioned investment strategy"
type: object
required:
  - schema_version
  - strategy_id
  - status
  - effective_from
  - scope
  - purpose
  - allocation
  - risk_limits
  - sell_policy
  - automation
  - review_policy
properties:
  schema_version: {const: 1}
  strategy_id: {type: string}
  status: {enum: [active, superseded]}
  effective_from: {type: string, format: date}
  scope:
    type: object
    required: [owner, portfolio, allocation_denominator]
  purpose:
    type: object
    additionalProperties: false
    required: [status, primary_objective, target_age, target_date, statement, lifestyle_constraint, enjoyment_preference]
    properties:
      status: {const: confirmed}
      primary_objective: {const: maximize_age_65_investment_profit}
      target_age: {const: 65}
      target_date: {type: string, format: date}
      statement: {type: string}
      lifestyle_constraint: {type: string}
      enjoyment_preference: {type: string}
  allocation:
    type: object
    required: [target_groups]
  risk_limits:
    type: object
    required: [direct_themes]
    properties:
      direct_themes:
        type: object
        required: [semiconductor]
        properties:
          semiconductor:
            type: object
            required:
              - exposure_group
              - policy_status
              - preferred_max_pct
              - rebalance_proposal_above_pct
              - denominator
              - strategic_review_treatment
              - priority
              - routine_additions_above_preferred_max
            properties:
              exposure_group: {const: direct_semiconductor}
              policy_status: {enum: [hard_constraint, policy_to_reconsider, explicit_exception]}
              preferred_max_pct: {type: number, minimum: 0, maximum: 1}
              rebalance_proposal_above_pct: {type: number, minimum: 0, maximum: 1}
              denominator: {const: household_total_assets_jpy}
              strategic_review_treatment: {enum: [hard_constraint, policy_to_reconsider, explicit_exception]}
              priority: {type: string}
              routine_additions_above_preferred_max: {type: boolean}
  sell_policy: {type: object}
  automation: {type: object}
  review_policy:
    type: object
    required: [satellite_parameters, output_contract]
    properties:
      satellite_parameters:
        type: object
        additionalProperties: false
        required: [review_frequency, satellites_allowed, positive_satellite_allocation_required, all_country_only_baseline_required, target_pct, securities, review_dimensions]
        properties:
          review_frequency: {type: string}
          satellites_allowed: {const: true}
          positive_satellite_allocation_required: {const: true}
          all_country_only_baseline_required: {const: true}
          target_pct: {$ref: "#/$defs/reviewer_parameter"}
          securities: {$ref: "#/$defs/reviewer_parameter"}
          review_dimensions:
            type: array
            minItems: 1
            items: {type: string}
      output_contract:
        type: object
        required: [existing_holdings, new_assets, required_action_fields]
$defs:
  reviewer_parameter:
    type: object
    required: [value, status]
    properties:
      value: {}
      status: {enum: [reviewer_to_propose, confirmed]}
