schema_version: 1
strategy_id: "husband_personal_2026-08-09-v2"
status: "active"
effective_from: "2026-08-09"
approved_by: "user"
approval_ref: "decisions/2026-08-09_act_s3_policy_approval.md"

scope:
  owner: "husband"
  portfolio: "personal_financial_assets"
  excludes:
    - "wife_personal_financial_assets"
  financial_context_ref: "financial/current.yaml"
  holding_metadata_ref: "holdings/current.yaml"
  allocation_denominator: "long_term_investable_assets_jpy"
  allocation_denominator_definition: >
    夫個人の総資産から生活防衛資金、ポイントその他の投資対象外資産を除いた長期運用資産。
    暗号資産は売却完了までは移行対象として追跡し、売却後はコアへ移す。

purpose:
  status: "confirmed"
  primary_objective: "maximize_age_65_investment_profit"
  target_age: 65
  target_date: "2057-01-07"
  statement: "今の生活を楽しみつつ無理のない範囲で運用し、65歳時点での投資利益を最大化する"
  lifestyle_constraint: >
    日常生活、旅行、趣味その他の現在の生活の楽しみを不当に削る拠出を前提にせず、
    家計・住宅ローン・生活防衛資金と両立する持続可能な拠出だけを使う。
  enjoyment_preference: >
    サテライトの最大半分、すなわち長期運用資産の最大8.75%程度までは趣味として持つ価値を認める。
    趣味枠であることを理由に期待収益率を高く見積もらない。

principles:
  - id: "theory_based_parameters"
    rule: "比率と閾値は統計・投資理論に基づき、現在の保有状況に合わせて後付けしない。"
  - id: "lifestyle_sustainable_contributions"
    rule: "現在の生活を楽しめる持続可能な拠出額を全候補で共通に固定する。"
  - id: "account_type_review_gate"
    rule: "売買可能な全明細の口座区分が確認できるまでChatGPT向けレビュー依頼を生成しない。"
  - id: "human_approval"
    rule: "すべての注文、売却、リバランスは提案に留め、ユーザの明示承認を必要とする。"
  - id: "execution_time_recalculation"
    rule: "数量、金額、比率は実行時点の価格、残高、税、手数料で再計算し、参考値を固定注文へ使わない。"

allocation:
  status: "approved"
  asset_mix:
    equity_pct: 1.00
    bond_pct: 0.00
    crypto_target_pct: 0.00
  target_groups:
    broad_core:
      target_pct: 0.825
      rebalance_proposal_below_pct: 0.80
      member_buckets:
        - "core"
        - "pension"
      new_recurring_contributions_pct: 1.00
      preferred_exposure: "all_country_equity"
    active_hobby:
      target_pct: 0.175
      rebalance_proposal_above_pct: 0.20
      no_trade_band_min_pct: 0.15
      no_trade_band_max_pct: 0.20
      absolute_max_pct: 0.20
      member_buckets:
        - "jun_core"
        - "satellite_core"
        - "satellite"
      reserved_cash_counts_from_approval: false
      routine_additions_allowed: false
      hobby_value_max_pct_of_long_term_investable_assets: 0.0875
      target_components:
        direct_semiconductor: 0.08
        cybersecurity_etf: 0.03
        uranium_etf: 0.025
        microsoft: 0.02
        palantir: 0.02
  tactical_cash:
    enabled: false
    target_pct: 0.00
  emergency_fund:
    target_jpy: 2000000
    included_in_allocation_denominator: false

core_policy:
  new_purchase_allocation:
    all_country_pct: 1.00
  existing_sp500:
    forced_sale: false
    new_routine_purchase: false
  deployment_default: "available_cash_to_all_country_core"

risk_limits:
  total_satellite:
    target_pct: 0.175
    no_trade_band_min_pct: 0.15
    no_trade_band_max_pct: 0.20
    absolute_max_pct: 0.20
    denominator: "long_term_investable_assets_jpy"
  single_theme:
    preferred_max_pct: 0.08
    denominator: "long_term_investable_assets_jpy"
  single_security:
    preferred_max_pct: 0.02
    denominator: "long_term_investable_assets_jpy"
  direct_themes:
    semiconductor:
      exposure_group: "direct_semiconductor"
      policy_status: "hard_constraint"
      preferred_max_pct: 0.12
      rebalance_proposal_above_pct: 0.12
      denominator: "household_total_assets_jpy"
      strategic_target_pct: 0.08
      strategic_target_denominator: "long_term_investable_assets_jpy"
      strategic_review_treatment: "hard_constraint"
      priority: "apply the stricter of the 8% strategic target and the separately approved 12% household-assets cap"
      routine_additions_above_preferred_max: false
      thesis_ref: "strategy/theses/semiconductor_2026-08-02.yaml"
      approval_ref: "decisions/2026-08-09_act_s3_policy_approval.md"
  high_volatility_single_security:
    preferred_max_pct: 0.02
    rebalance_proposal_above_pct: 0.02
    symbols:
      - "PLTR"

sell_policy:
  price_decline_alone_is_trigger: false
  thesis_review_on_material_decline: true
  crypto_final_disposition: "sell_all_after_acquisition_history_is_secured"
  sale_proceeds_default_destination: "all_country_core"
  tax_policy:
    use_2023_to_2025_carried_forward_capital_losses: false
    extra_work_for_2353_small_loss_offset_or_carryforward: false
    recompute_2026_realized_profit_loss_after_all_2026_sales: true

automation:
  agent_may:
    - "collect_and_validate_facts"
    - "calculate_exposures"
    - "propose_rebalance"
    - "prepare_order_parameters_for_user_approval"
  agent_must_not:
    - "place_orders"
    - "treat_proposals_as_executed"
    - "reuse_reference_quantities_without_execution_time_recalculation"
  human_approval_required_for_all_trades: true

review_policy:
  price_move: "review_trigger_only"
  strategy_review_frequency: "on_demand"
  allocation_review_frequency: "after_material_execution_or_new_snapshot"
  thesis_review_frequency: "quarterly_or_material_event"
  satellite_parameters:
    review_frequency: "on_demand"
    satellites_allowed: true
    positive_satellite_allocation_required: true
    all_country_only_baseline_required: true
    target_pct:
      value: 0.175
      status: "confirmed"
    securities:
      value:
        direct_semiconductor: 0.08
        cybersecurity_etf: 0.03
        uranium_etf: 0.025
        microsoft: 0.02
        palantir: 0.02
      status: "confirmed"
    review_dimensions:
      - "65歳時点の税・費用控除後の実質投資利益"
      - "全世界株式のみの基準案との差"
      - "集中リスクと趣味価値の両立"
  output_contract:
    existing_holdings: "全売買可能明細について保有・一部売却・全部売却を一件ずつ示す"
    new_assets: "現在未保有の資産について購入対象、または新規購入なしを明示する"
    required_action_fields:
      - "what"
      - "account_type"
      - "when"
      - "how"
      - "quantity_or_amount_or_formula"
      - "rationale"
      - "requires_user_approval"
