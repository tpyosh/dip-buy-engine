schema_version: 1
strategy_id: "husband_personal_2026-08-09"
status: "active"
effective_from: "2026-08-09"
approved_by: "user"

scope:
  owner: "husband"
  portfolio: "personal_financial_assets"
  excludes:
    - "wife_personal_financial_assets"
  financial_context_ref: "financial/current.yaml"
  holding_metadata_ref: "holdings/current.yaml"
  allocation_denominator: "snapshot.total_assets_jpy"

purpose:
  status: "confirmed"
  primary_objective: "maximize_age_65_investment_profit"
  target_age: 65
  target_date: "2057-01-07"
  statement: "今の生活を楽しみつつ無理のない範囲で運用し、65歳時点での投資利益を最大化する"
  lifestyle_constraint: >
    日常生活、旅行、趣味その他の現在の生活の楽しみを不当に削る拠出を前提にせず、
    家計・住宅ローン・生活防衛資金と両立する持続可能な拠出だけを使う。
  enjoyment_preference: >
    資産効率だけを理由にオール・カントリー型商品だけへ固定せず、常識的な集中・損失リスクの
    範囲でサテライト投資を楽しむ。サテライト比率と対象銘柄は独立ChatGPTのレビュー対象とする。

principles:
  - id: "theory_based_parameters"
    rule: >
      比率と閾値は、個人的事情を制約条件とし、統計・投資理論に基づいて機械的に決める。
      現在の保有状況に合わせた後付け調整をしない。
  - id: "lifestyle_sustainable_contributions"
    rule: >
      65歳時点の利益最大化は、現在の生活を楽しめる持続可能な拠出額を全候補で共通に固定して比較する。
      拠出額を増やすこと自体で目的関数を改善した扱いにしない。
  - id: "satellite_enjoyment_parameterized"
    rule: >
      サテライト投資を正の配分で許容し、その比率、銘柄、単一銘柄・単一テーマ上限を
      独立レビュアーがオール・カントリーのみの基準案と比較して提案する。
  - id: "account_type_review_gate"
    rule: >
      売買可能な全明細がNISA・特定口座・一般口座のいずれかに分類できるまで、
      ChatGPT向けレビュー依頼とレビュー結果を出力しない。
  - id: "concrete_action_output"
    rule: >
      レビュー結果は、現在保有する各資産の保有・売却判断と、現在保有しない資産の購入判断を、
      対象、口座、時期、方法、数量または金額・算式まで含む具体的行動として示す。
  - id: "human_approval"
    rule: "エージェントは提案までとし、すべての売買とリバランスはユーザが承認する。"
  - id: "thesis_before_price"
    rule: "値下がり幅より下落理由を優先し、価格変動だけで売却しない。"
  - id: "no_outcome_bias"
    rule: "過去判断は、当時利用可能だった情報、想定、判断プロセス、実際の結果を分けて評価する。"
  - id: "dated_evidence"
    rule: "変化し得る税制、市場価格、商品仕様、統計には基準日と一次情報の出典を持たせる。"
  - id: "dip_buy_reserve_is_deployment_tool"
    rule: >
      投資待機資金は残高維持自体を目的とせず、市場下落時に使うための手段とする。
      下落局面のレビューでは使用案を必ず比較する。

allocation:
  status: "current_approved_baseline_pending_parameter_review"
  target_groups:
    broad_core:
      target_pct: 0.70
      rebalance_proposal_below_pct: 0.65
      member_buckets:
        - "core"
        - "pension"
      notes:
        - "pensionのオルカンを経済的なbroad coreに含める"
        - "取引可能coreとpensionはレポート上で内訳を維持する"
        - "70%は現行承認値であり、次回独立レビューのサテライト比率提案を拘束しない"
    active_hobby:
      target_pct: 0.30
      rebalance_proposal_above_pct: 0.35
      member_buckets:
        - "jun_core"
        - "satellite_core"
        - "satellite"
      reserved_cash_counts_from_approval: true
      notes:
        - "趣味としての押し目買い余力を含む"
        - "損失許容度が高くても、集中リスクは別途管理する"
        - "30%は現行承認値であり、次回独立レビューのサテライト比率提案を拘束しない"

core_policy:
  new_purchase_allocation:
    all_country_pct: 1.00
    preferred_product: "楽天・プラス・オールカントリー株式インデックス・ファンド"
  existing_sp500:
    forced_sale: false
    new_routine_purchase: false
  deployment_default: "lump_sum"
  rationale:
    - "待機資金の期待機会損失を避ける"
    - "既存S&P500は税・口座・取引コストを無視して移し替えない"

risk_limits:
  direct_themes:
    semiconductor:
      exposure_group: "direct_semiconductor"
      policy_status: "hard_constraint"
      preferred_max_pct: 0.12
      rebalance_proposal_above_pct: 0.12
      denominator: "household_total_assets_jpy"
      strategic_review_treatment: "policy_to_reconsider"
      priority: "apply the strictest of total satellite, single theme, and direct semiconductor limits after household reserve and legal/account constraints"
      routine_additions_above_preferred_max: false
      thesis_ref: "strategy/theses/semiconductor_2026-08-02.yaml"
      approval_ref: "decisions/2026-08-02_review_questionnaire_answers.md"
  high_volatility_single_security:
    preferred_max_pct: 0.05
    rebalance_proposal_above_pct: 0.08
    symbols:
      - "PLTR"

sell_policy:
  price_decline_alone_is_trigger: false
  thesis_review_on_material_decline: true
  sell_proposal_conditions:
    - "構造成長仮説の破綻"
    - "価値獲得能力または資本効率の持続的な悪化"
    - "当初の保有理由を代替する、より妥当な証拠の出現"
    - "holdings/current.yamlに記録されたユーザの売却意向"
  core_is_theoretically_sellable: true
  core_break_examples:
    - "資本主義または広範な株式価値獲得の構造的崩壊"
    - "米国を含む世界株式の長期成長前提の重大な破綻"

automation:
  agent_may:
    - "collect_and_validate_facts"
    - "calculate_exposures"
    - "evaluate_theses"
    - "propose_rebalance"
    - "propose_new_securities"
  agent_must_not:
    - "place_orders"
    - "treat_proposals_as_executed"
    - "change_strategy_without_user_approval"
  human_approval_required_for_all_trades: true

review_policy:
  price_move: "review_trigger_only"
  strategy_review_frequency: "annual"
  allocation_review_frequency: "monthly"
  thesis_review_frequency: "quarterly_or_material_event"
  semiconductor_reduction_target_pct: 0.12
  semiconductor_sale_priority: "proposal_requested_from_independent_review"
  dip_buy_reserve_policy_parameters: "proposal_requested_from_current_monthly_independent_review"
  satellite_parameters:
    review_frequency: "monthly"
    satellites_allowed: true
    positive_satellite_allocation_required: true
    all_country_only_baseline_required: true
    target_pct:
      value: null
      status: "reviewer_to_propose"
      denominator: "long_term_investable_portfolio_jpy"
    securities:
      value: null
      status: "reviewer_to_propose"
    review_dimensions:
      - "65歳時点の税・費用控除後の実質投資利益への寄与"
      - "オール・カントリーのみの基準案との差"
      - "総サテライト・単一テーマ・単一銘柄の集中リスク"
      - "商品コスト、税区分、売買回転、実装可能性"
      - "趣味として楽しめる正の配分と資産効率の両立"
  output_contract:
    existing_holdings: "全売買可能明細について保有・一部売却・全部売却を一件ずつ示す"
    new_assets: "現在未保有の資産について購入対象、または新規購入なしを明示する"
    required_action_fields:
      - "what"
      - "account_type"
      - "when"
      - "how"
      - "quantity_or_amount_or_formula"
      - "rationale"
      - "requires_user_approval"
